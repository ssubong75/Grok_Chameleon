<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'">
<title>Photo Editor</title><link rel="stylesheet" href="editor.css"><link rel="stylesheet" href="styles.css"></head>
<body>
<header id="menubar" role="menubar"><strong id="brand">Photo Editor</strong><nav id="menus"></nav><button id="save-app">Save to App</button><span class="grow"></span><button id="exit" title="Return to Chameleon">×</button></header>
<section id="options"><span id="tool-name">Rectangular Marquee Tool</span><span class="separator"></span><button class="brush-option" data-command="tool.brushSettings">Brush Settings…</button><button class="brush-option" data-command="tool.brushPresets">Presets…</button><label class="brush-option">Size <input id="brush-size" type="number" value="24" min="1" max="1000"></label><label class="brush-option">Hardness <input id="brush-hardness" type="number" value="100" min="0" max="100">%</label><label class="brush-option">Opacity <input id="brush-opacity" type="number" value="100" min="1" max="100">%</label><label id="font-option">Font <select id="text-font"><option>Inter</option><option>Arial</option><option>Georgia</option><option>Segoe UI</option><option>Malgun Gothic</option></select><input id="text-size" type="number" value="48" min="1" max="1000"></label><span id="clone-option"><label>Sample <select id="clone-sample"><option value="current">Current Layer</option><option value="all">All Layers</option></select></label><label><input id="clone-aligned" type="checkbox" checked>Aligned</label></span><span id="retouch-option"><label>Strength <input id="retouch-strength" type="number" value="50" min="0" max="100">%</label><label>Range <select id="retouch-range"><option value="shadows">Shadows</option><option value="midtones" selected>Midtones</option><option value="highlights">Highlights</option></select></label><label><input id="retouch-protect" type="checkbox" checked>Protect Tones</label><select id="sponge-mode" aria-label="Sponge mode"><option value="desaturate">Desaturate</option><option value="saturate">Saturate</option></select></span><label id="selection-option">Style <select id="selection-style"><option value="normal">Normal</option><option value="ratio">Fixed Ratio</option><option value="size">Fixed Size</option></select><input id="selection-width" type="number" value="1" min=".01" step="any" aria-label="Selection width or ratio"><span>:</span><input id="selection-height" type="number" value="1" min=".01" step="any" aria-label="Selection height or ratio"></label><label id="crop-option"><input id="crop-delete" type="checkbox" checked>Delete Cropped Pixels</label><button id="gradient-option" data-command="tool.gradientOptions">Gradient Options…</button><label id="shape-option">Shape <select id="shape-type"><option value="rectangle">Rectangle</option><option value="ellipse">Ellipse</option><option value="polygon">Polygon</option><option value="star">Star</option><option value="line">Line</option></select></label><label id="spot-healing-option" hidden>Type <select id="spot-healing-mode"><option value="contentAware">Content-Aware</option><option value="proximity">Proximity Match</option></select></label><span id="red-eye-option" hidden><label>Pupil Size <input id="red-eye-size" type="number" value="50" min="1" max="100">%</label><label>Darken <input id="red-eye-darken" type="number" value="50" min="0" max="100">%</label></span><span id="magnetic-option" hidden><label>Width <input id="magnetic-width" type="number" value="10" min="1" max="256">px</label><label>Contrast <input id="magnetic-contrast" type="number" value="10" min="1" max="100">%</label></span><label id="bucket-option">Tolerance <input id="bucket-tolerance" type="number" value="32" min="0" max="255"></label><span class="grow"></span><button id="fit">Fit Screen</button><button id="actual">100%</button></section>
<main><aside id="tools" aria-label="Tools"></aside><section id="workspace"><div id="tabs"></div><div id="stage"><div id="artboard"><canvas id="composite"></canvas><canvas id="overlay"></canvas></div><section id="home"><h1>Photo Editor</h1><p>Create a new document or open an image.</p><button data-command="file.new">New…</button><button data-command="file.open">Open…</button></section></div></section>
<aside id="dock"><section id="colors"><div class="panel-title dock-tabs"><button data-color-tab="color" aria-selected="true">Color</button><button data-color-tab="swatches" aria-selected="false">Swatches</button></div><div id="color-picker"><div id="color-field"></div><input id="color-hue" type="range" min="0" max="359" value="0" aria-label="Hue"></div><div id="swatch-list" hidden></div><div class="color-row"><label>Foreground <input id="foreground" type="color" value="#000000"></label><label>Background <input id="background" type="color" value="#ffffff"></label></div></section><section id="navigator" hidden><div class="panel-title">Navigator</div><div id="navigator-stage"><canvas id="navigator-image" width="236" height="140"></canvas><div id="navigator-viewport"></div></div></section><section id="history" hidden><div class="panel-title">History</div><div id="history-list"></div></section><section id="properties" hidden><div class="panel-title">Properties</div><div id="properties-body"></div></section><section id="layers"><div class="panel-title dock-tabs" role="tablist"><button role="tab" data-dock-tab="layers" aria-selected="true">Layers</button><button role="tab" data-dock-tab="channels" aria-selected="false">Channels</button><button role="tab" data-dock-tab="paths" aria-selected="false">Paths</button></div>
<div id="layer-panel" class="dock-body"><div class="layer-settings"><select id="blend" aria-label="Blend mode"><option value="source-over">Normal</option><option>multiply</option><option>screen</option><option>overlay</option><option>darken</option><option>lighten</option><option>color-dodge</option><option>color-burn</option><option>hard-light</option><option>soft-light</option><option>difference</option><option>exclusion</option><option>hue</option><option>saturation</option><option>color</option><option>luminosity</option></select><label>Opacity <input id="opacity" type="number" min="0" max="100" value="100">%</label></div><div id="layer-list"></div><footer><button data-command="layer.new" title="New Layer">＋</button><button data-command="layer.duplicate" title="Duplicate Layer">▣</button><button data-command="layer.up" title="Raise Layer">↑</button><button data-command="layer.down" title="Lower Layer">↓</button><button data-command="layer.delete" title="Delete Layer">−</button></footer></div>
<div id="channel-panel" class="dock-body" hidden><div id="channel-list"></div><footer><button data-command="channel.load" title="Load Channel as Selection">▧</button><button data-command="channel.save" title="Save Selection as Channel">＋</button><button data-command="channel.rename" title="Rename Channel">…</button><button data-command="channel.delete" title="Delete Channel">−</button></footer></div>
<div id="path-panel" class="dock-body" hidden><div id="path-list"></div><footer><button data-command="path.fill" title="Fill Path">●</button><button data-command="path.stroke" title="Stroke Path">○</button><button data-command="path.selection" title="Load Path as Selection">▧</button><button data-command="path.fromSelection" title="Make Work Path from Selection">▱</button><button data-command="path.duplicate" title="Duplicate Path">▣</button><button data-command="path.new" title="New Path">＋</button><button data-command="path.delete" title="Delete Path">−</button></footer></div></section></aside></main>
<footer id="status"><label><input id="zoom" type="number" min="1" max="3200" value="100">%</label><span id="dimensions"></span><span class="grow"></span><span id="message" role="status">Photo Editor</span></footer>
<input id="open-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp,.psd,.tif,.tiff,.gcphoto" hidden>
<dialog id="dialog"><form method="dialog"><h2 id="dialog-title"></h2><div id="dialog-body"></div><div class="dialog-actions"><button type="button" id="dialog-cancel">Cancel</button><button type="submit" value="ok" id="dialog-ok">OK</button></div></form></dialog>
<script src="vendor/pako.js"></script><script src="vendor/utif.js"></script><script src="vendor/ag-psd.js"></script><script type="module" src="app.js"></script></body></html>
