<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'">
<title>Photo Editor</title><link rel="stylesheet" href="editor.css"><link rel="stylesheet" href="styles.css"></head>
<body>
<header id="titlebar"><span id="editor-version"></span><button id="titlebar-appearance" type="button" title="Appearance Mode"><img src="icons/moon.svg" alt=""></button><button id="titlebar-search" type="button" title="Search commands"><img src="icons/search.svg" alt=""></button><select id="workspace-switch" aria-label="Workspace"></select></header>
<nav id="menus" hidden aria-hidden="true"></nav><div id="editor-actions" hidden><button id="save-app">Save to App</button><button id="exit" title="Return to Chameleon">×</button></div>
<section id="options"><button id="options-home" type="button" class="crop-icon-option" aria-label="Home" title="Home"><img src="icons/house.svg" alt=""></button><span class="separator"></span><button id="options-tool" type="button" class="crop-icon-option" aria-label="Current tool"><img src="icons/square-dashed.svg" alt=""></button><button id="options-tool-menu" type="button" class="crop-icon-option" aria-label="Tool menu"><img src="icons/chevron-down.svg" alt=""></button><span class="separator"></span><span id="tool-name">Rectangular Marquee Tool</span><span class="separator"></span><button class="brush-option" data-command="tool.brushSettings">Brush Settings…</button><button class="brush-option" data-command="tool.brushPresets">Presets…</button><label class="brush-option">Size <input id="brush-size" type="number" value="20" min="1" max="1000"></label><label class="brush-option">Hardness <input id="brush-hardness" type="number" value="100" min="0" max="100">%</label><label class="brush-option">Opacity <input id="brush-opacity" type="number" value="100" min="1" max="100">%</label><label class="brush-option">Flow <input id="brush-flow" type="number" value="100" min="1" max="100">%</label><label id="font-option">Font <select id="text-font"><option>Inter</option><option>Arial</option><option>Georgia</option><option>Segoe UI</option><option>Malgun Gothic</option></select><input id="text-size" type="number" value="48" min="1" max="1000"></label><span id="clone-option"><label>Sample <select id="clone-sample"><option value="current">Current Layer</option><option value="below">Current & Below</option><option value="all">All Layers</option></select></label><label><input id="clone-aligned" type="checkbox" checked>Aligned</label></span><span id="retouch-option"><label>Strength <input id="retouch-strength" type="number" value="50" min="0" max="100">%</label><label>Range <select id="retouch-range"><option value="shadows">Shadows</option><option value="midtones" selected>Midtones</option><option value="highlights">Highlights</option></select></label><label><input id="retouch-protect" type="checkbox" checked>Protect Tones</label><select id="sponge-mode" aria-label="Sponge mode"><option value="desaturate">Desaturate</option><option value="saturate">Saturate</option></select></span><label id="selection-feather-option" hidden><span id="selection-feather-label">Feather</span> <input id="selection-feather" type="number" value="0" min="0" max="1000"> <span>px</span></label><label id="selection-antialias" hidden><input id="selection-antialias-box" type="checkbox" checked> <span id="selection-antialias-label">Anti-alias</span></label><label id="selection-option"><span id="selection-style-label">Style</span> <select id="selection-style"><option value="normal">Normal</option><option value="ratio">Fixed Ratio</option><option value="size">Fixed Size</option></select></label><span id="selection-size"><label><span id="selection-width-label">Width</span> <input id="selection-width" type="number" value="1" min=".01" step="any" aria-label="Selection width or ratio"></label><button id="selection-swap" type="button" aria-label="Swaps height and width" title="Swaps height and width"><img src="icons/arrow-left-right.svg" alt=""></button><label><span id="selection-height-label">Height</span> <input id="selection-height" type="number" value="1" min=".01" step="any" aria-label="Selection height or ratio"></label><span id="selection-unit"></span></span><span id="crop-option"><input id="crop-delete" type="checkbox" checked>Delete Cropped Pixels <input id="crop-fill" type="checkbox">Content-Aware <select id="crop-ratio" aria-label="Crop Ratio"><option value="">Ratio</option><option value="original">Original Ratio</option><option value="1:1">1 : 1 (Square)</option><option value="4:5">4 : 5 (8 : 10)</option><option value="5:7">5 : 7</option><option value="2:3">2 : 3 (4 : 6)</option><option value="16:9">16 : 9</option><option value="whr">W x H x Resolution</option><option value="preset:4x5in">4 x 5 in 300 ppi</option><option value="preset:8.5x11in">8.5 x 11 in 300 ppi</option><option value="preset:1024x768px">1024 x 768 px 92 ppi</option><option value="preset:1280x800px">1280 x 800 px 113 ppi</option><option value="preset:1366x768px">1366 x 768 px 135 ppi</option><option value="preset:4x6in">4 x 6 in 300 ppi</option><option value="preset:5x7in">5 x 7 in 300 ppi</option><option value="preset:8x10in">8 x 10 in 300 ppi</option><option value="front">Front Image</option></select> <span id="crop-size" hidden><input id="crop-width" aria-label="Crop Width" placeholder="W" size="8"> <input id="crop-height" aria-label="Crop Height" placeholder="H" size="8"> <input id="crop-resolution" aria-label="Resolution" placeholder="Resolution" size="6"> <select id="crop-resolution-unit" aria-label="Resolution Unit"><option value="px/in">px/in</option><option value="px/cm">px/cm</option></select></span> <select id="crop-overlay" aria-label="Crop Overlay"><option value="thirds">Rule of Thirds</option><option value="grid">Grid</option><option value="diagonal">Diagonal</option><option value="triangle">Triangle</option><option value="goldenRatio">Golden Ratio</option><option value="goldenSpiral">Golden Spiral</option></select> <select id="crop-overlay-show" aria-label="Crop Overlay Display"><option value="auto">Auto Show Overlay</option><option value="always">Always Show Overlay</option><option value="never">Never Show Overlay</option></select> <label><input id="crop-shield" type="checkbox" checked>Shield</label> <select id="crop-shield-color" aria-label="Crop Shield Color"><option value="canvas">Match Canvas</option><option value="custom">Custom</option></select> <input id="crop-shield-custom" type="color" value="#000000" aria-label="Custom Crop Shield Color" hidden> <label>Opacity <input id="crop-shield-opacity" type="number" min="0" max="100" value="75">%</label> <label><input id="crop-shield-auto" type="checkbox" checked>Auto Adjust Opacity</label> <button type="button" id="crop-straighten">Straighten</button> <label><input id="crop-classic" type="checkbox">Classic Mode</label> <label><input id="crop-auto-center" type="checkbox" checked>Auto Center Preview</label> <label><input id="crop-show-outside" type="checkbox" checked>Show Cropped Area</label></span><button id="gradient-option" data-command="tool.gradientOptions">Gradient Options…</button><label id="shape-option">Shape <select id="shape-type"><option value="rectangle">Rectangle</option><option value="ellipse">Ellipse</option><option value="polygon">Polygon</option><option value="star">Star</option><option value="line">Line</option></select></label><label id="spot-healing-option" hidden>Type <select id="spot-healing-mode"><option value="contentAware">Content-Aware</option><option value="proximity">Proximity Match</option></select></label><span id="red-eye-option" hidden><label>Pupil Size <input id="red-eye-size" type="number" value="50" min="1" max="100">%</label><label>Darken <input id="red-eye-darken" type="number" value="50" min="0" max="100">%</label></span><span id="magnetic-option" hidden><label>Width <input id="magnetic-width" type="number" value="10" min="1" max="256">px</label><label>Contrast <input id="magnetic-contrast" type="number" value="10" min="1" max="100">%</label><label>Frequency <input id="magnetic-frequency" type="number" value="57" min="0" max="100"></label></span><label id="bucket-option">Tolerance <input id="bucket-tolerance" type="number" value="32" min="0" max="255"></label><span class="grow"></span><button id="fit">Fit Screen</button><button id="actual">100%</button></section>
<main><aside id="tools" aria-label="Tools"></aside><section id="workspace"><div id="tabs"></div><div id="stage"><div id="artboard" hidden><canvas id="composite"></canvas><canvas id="overlay"></canvas></div><section id="home"><h1>Photo Editor</h1><p>Create a new document or open an image.</p><button data-command="file.new">New…</button><button data-command="file.open">Open…</button></section></div></section>
<aside id="dock"><section id="colors"><div class="panel-title dock-tabs"><button data-color-tab="color" aria-selected="true">Color</button><button data-color-tab="swatches" aria-selected="false">Swatches</button></div><div id="color-picker"><div id="color-field"></div><input id="color-hue" type="range" min="0" max="359" value="0" aria-label="Hue"></div><div id="swatch-list" hidden></div><div class="color-row"><label>Foreground <input id="foreground" type="color" value="#000000"></label><label>Background <input id="background" type="color" value="#ffffff"></label></div></section><section id="navigator" hidden><div class="panel-title">Navigator</div><div id="navigator-stage"><canvas id="navigator-image" width="236" height="140"></canvas><div id="navigator-viewport"></div></div></section><section id="history" hidden><div class="panel-title">History</div><div id="history-list"></div></section><section id="properties" hidden><div class="panel-title">Properties</div><div id="properties-body"></div></section><section id="layers"><div class="panel-title dock-tabs" role="tablist"><button role="tab" data-dock-tab="layers" aria-selected="true">Layers</button><button role="tab" data-dock-tab="channels" aria-selected="false">Channels</button><button role="tab" data-dock-tab="paths" aria-selected="false">Paths</button></div>
<div id="layer-panel" class="dock-body"><div class="layer-settings"><select id="blend" aria-label="Blend mode"><option value="source-over">Normal</option><option>multiply</option><option>screen</option><option>overlay</option><option>darken</option><option>lighten</option><option>color-dodge</option><option>color-burn</option><option>hard-light</option><option>soft-light</option><option>difference</option><option>exclusion</option><option>hue</option><option>saturation</option><option>color</option><option>luminosity</option></select><label>Opacity <input id="opacity" type="number" min="0" max="100" value="100">%</label></div><div id="layer-list"></div><footer class="layer-panel-footer"><button data-command="layer.linkLayers" title="Link layers"><img src="icons/link-2.svg" alt=""></button><button data-command="layer.style" title="Add a layer style">fx</button><button data-command="layer.footerMask" title="Add Layer Mask"><img src="icons/layer-mask.svg" alt=""></button><button data-command="layer.adjustment" title="Create new fill or adjustment layer"><img src="icons/adjustment-layer.svg" alt=""></button><button data-command="layer.footerGroup" title="Create a new group"><img src="icons/folder.svg" alt=""></button><button data-command="layer.new" title="Create a new layer"><img src="icons/square-plus.svg" alt=""></button><button data-command="layer.delete" title="Delete layer"><img src="icons/trash.svg" alt=""></button></footer></div>
<div id="channel-panel" class="dock-body" hidden><div id="channel-list"></div><footer><button data-command="channel.load" title="Load Channel as Selection">▧</button><button data-command="channel.save" title="Save Selection as Channel">＋</button><button data-command="channel.rename" title="Rename Channel">…</button><button data-command="channel.delete" title="Delete Channel">−</button></footer></div>
<div id="path-panel" class="dock-body" hidden><div id="path-list"></div><footer><button data-command="path.fill" title="Fill Path">●</button><button data-command="path.stroke" title="Stroke Path">○</button><button data-command="path.selection" title="Load Path as Selection">▧</button><button data-command="path.fromSelection" title="Make Work Path from Selection">▱</button><button data-command="path.duplicate" title="Duplicate Path">▣</button><button data-command="path.new" title="New Path">＋</button><button data-command="path.delete" title="Delete Path">−</button></footer></div></section></aside></main>
<footer id="status"><label><input id="zoom" type="number" min="1" max="3200" value="100">%</label><span id="dimensions"></span><span class="grow"></span><span id="message" role="status">Photo Editor</span></footer>
<input id="open-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp,.psd,.psb,.tif,.tiff,.gcphoto" hidden>
<dialog id="dialog"><form method="dialog"><h2 id="dialog-title"></h2><div id="dialog-body"></div><div class="dialog-actions"><button type="button" id="dialog-cancel">Cancel</button><button type="submit" value="ok" id="dialog-ok">OK</button></div></form></dialog>
<script src="vendor/pako.js"></script><script src="vendor/utif.js"></script><script src="vendor/ag-psd.js"></script><script type="module" src="app.js"></script></body></html>
