                </button>
                <button class="b_detail_thumb b_detail_thumb_image" type="button" aria-label="Image version">
                  <span class="b_detail_thumb_fill"></span>
                </button>
                <button class="b_detail_thumb b_detail_thumb_image" type="button" aria-label="Image version">
                  <span class="b_detail_thumb_fill"></span>
                </button>
                <button class="b_detail_thumb b_detail_thumb_video" type="button" aria-label="Video version">
                  <span class="b_detail_thumb_fill"></span>
                  <span class="b_detail_thumb_type"><img src="./assets/icons/video.svg" alt="" /></span>
                </button>
              </aside>
              <div class="b_detail_media_wrap">
                <div class="b_detail_meta_row">
                  <span class="b_detail_provider_badge b_detail_provider_image"><img src="./assets/icons/image.svg" alt="" /></span>
                  <span class="b_detail_model_badge"><span class="b_detail_resolution_name"></span><span class="b_detail_model_name">Quality</span></span>
                </div>
                <div class="b_detail_media b_detail_media_image"><img src="./assets/icons/image.svg" alt="" /></div>
              </div>
              <aside class="b_detail_actions" aria-label="Build actions">
                <button class="b_detail_action b_detail_heart text2image-detail-save imagine-save-heart" type="button" aria-label="Favorite" aria-pressed="false" hidden>
                  <span class="imagine-save-heart-icon" aria-hidden="true">
                    <svg class="imagine-save-heart-svg" viewBox="0 0 24 24" focusable="false">
                      <path class="imagine-save-heart-path" d="M12 20.2c-.28 0-.55-.1-.76-.29C6.15 15.32 3 12.48 3 8.62 3 5.78 5.12 3.7 7.9 3.7c1.62 0 3.16.75 4.1 1.94.94-1.19 2.48-1.94 4.1-1.94 2.78 0 4.9 2.08 4.9 4.92 0 3.86-3.15 6.7-8.24 11.29-.21.19-.48.29-.76.29Z"></path>
                    </svg>
                  </span>
                </button>
                <button class="b_detail_action b_detail_edit" type="button" aria-label="Edit"><span class="b_detail_edit_glyph" aria-hidden="true">e</span></button>
	                <button class="b_detail_action b_detail_move" type="button" aria-label="Move to Collection">
                  <svg class="b_detail_action_glyph" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 17 17 7"></path><path d="M10 7h7v7"></path></svg>
                </button>
                <button class="b_detail_action b_detail_download" type="button" aria-label="Download"><svg class="detail_download_glyph" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5v14"></path><path d="m7 14 5 5 5-5"></path></svg></button>
                <button class="b_detail_action b_detail_delete" type="button" aria-label="Delete"><span class="b_detail_delete_icon" aria-hidden="true"></span></button>
              </aside>
            </div>
          </section>
          <div class="b_detail_meta" title="Prompt"><span>Prompt</span></div>
        </section>

        <section id="prompt_main" class="prompt_main" hidden aria-label="Prompt main">
          <header class="prompt_main_header">
            <div class="prompt_title_row">
              <h2><button class="prompt_title_btn" type="button">Prompt</button></h2>
              <button class="prompt_write_btn" type="button"><span aria-hidden="true">+</span> Write</button>
              <p class="prompt_count">0 items</p>
            </div>
          </header>
          <section class="card_list prompt_card_list" aria-label="Prompts">

          </section>
        </section>

        <section id="prompt_save" class="prompt_save" hidden aria-label="New prompt">
          <article class="prompt_save_card" role="dialog" aria-modal="true" aria-label="New prompt">
            <input class="prompt_save_title" type="text" placeholder="Prompt title" aria-label="Prompt title" />
            <div class="prompt_save_split">
              <textarea class="prompt_save_text prompt_save_original" aria-label="Prompt content" placeholder="Write a prompt..."></textarea>
              <div class="prompt_save_divider_box" aria-hidden="true"><span></span></div>
              <textarea class="prompt_save_text prompt_save_translation" aria-label="Translated prompt" placeholder="Translation appears here." readonly></textarea>
            </div>
            <div class="prompt_save_actions">
              <button class="ghost_btn prompt_save_translate" type="button" aria-label="ENG to KOR">
                <span>ENG</span>
                <svg class="translation_arrow_icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M14 7l5 5-5 5" /></svg>
                <span>KOR</span>
              </button>
              <div class="prompt_save_actions_right">
                <button id="prompt_save_cancel" class="ghost_btn prompt_save_cancel" type="button">Cancel</button>
                <button id="prompt_save_confirm" class="primary_btn prompt_save_confirm" type="button">Save</button>
              </div>
            </div>
          </article>
        </section>

        <section id="usage" class="usage" hidden aria-label="Usage">
          <header class="usage_header">
            <h2>Usage</h2>
            <p>Build and Imagine usage overview</p>
          </header>
          <section class="usage_body">
            <article class="usage_card">
              <strong>Build</strong>
              <span>Waiting for API usage data.</span>
            </article>
            <article class="usage_card">
              <strong>Imagine</strong>
              <span>Waiting for web session usage data.</span>
            </article>
          </section>
        </section>

        <section id="account" class="account" hidden tabindex="-1" aria-label="Account">
          <header class="account_screen_head b_main_header">
            <h2>Account</h2>
            <div class="account_main_actions">
              <button id="account_all_delete_btn" class="account_all_delete_btn" type="button" disabled>All Delete</button>
            </div>
          </header>
          <section class="account_total_panel" aria-label="Total account">
            <button id="total_account_btn" class="total_account_btn" type="button">Total Account</button>
          </section>
          <section class="account_selection_panel">
            <div class="account_list">
              <section class="account_column">
                <div class="account_column_body"></div>
              </section>
              <section class="account_column">
                <div class="account_column_body"></div>
              </section>
            </div>
          </section>
        </section>

        <section id="composer" class="composer" aria-label="Create media">
          <div id="composer_upload_tray" class="composer_upload_tray" hidden aria-label="Attachments">
            <label class="composer_upload_box" id="composer_upload_box">
              <input id="image_files" type="file" accept="image/*,video/mp4,video/webm,video/quicktime,video/*" multiple />
              <img src="./assets/icons/upload-plus.svg" alt="" />
              <span><strong>Image</strong><small>Upload or Drop</small></span>
            </label>
            <div id="composer_upload_thumb_list" class="composer_upload_thumb_list" aria-label="Recent uploads">
            </div>
            <div id="composer_attached_list" class="composer_attached_list" aria-label="Selected attachments">
            </div>
          </div>
          <div class="composer_input_row">
            <button id="composer_attach" class="composer_attach" type="button" aria-label="Attach">+</button>
            <button id="composer_save" class="composer_save" type="button">Save</button>
            <textarea id="composer_input" rows="1" wrap="soft" placeholder="Please enter the prompt"></textarea>
            <button id="composer_send" class="composer_send" type="button" aria-label="Generate">
              <svg class="composer_send_triangle" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
                <path d="M5.2 3.6c0-.95 1.03-1.55 1.86-1.07l10.4 6.1c.82.48.82 1.66 0 2.14l-10.4 6.1c-.83.48-1.86-.12-1.86-1.07V3.6Z"></path>
              </svg>
            </button>
          </div>
          <div class="composer_options">
            <span class="composer_provider_badge provider_imagine">Imagine</span>
            <div class="composer_mode_controls">
              <div class="composer_mode" role="tablist" aria-label="Mode">
                <button class="tab active" type="button" data-mode="image" role="tab" aria-label="Image"><img src="./assets/icons/image.svg" alt="" /></button>
                <button class="tab" type="button" data-mode="video" role="tab" aria-label="Video"><img src="./assets/icons/video.svg" alt="" /></button>
                <button class="tab build_only_tab" type="button" data-mode="video_edit" role="tab" aria-label="Video Edit"><img src="./assets/icons/video-edit.svg" alt="" /></button>
                <button class="tab" type="button" data-mode="extend" role="tab" aria-label="Extend">
                  <span class="tab_icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M4 12h12"/><path d="m12 7 5 5-5 5"/><path d="M20 5v14"/></svg>
                  </span>
                </button>
                <button class="tab" type="button" data-mode="analyze" role="tab" aria-label="Analyzer" title="Analyzer"><img src="./assets/icons/search.svg" alt="" /></button>
              </div>
              <div class="controls_grid">
                <div class="custom_select" data-composer-control="video-model" hidden>
                  <button class="custom_select_btn" type="button">M 1.5</button>
                  <div class="custom_select_menu">
                    <button class="custom_select_option active" type="button">M 1.5</button>
                    <button class="custom_select_option" type="button">M 1.0</button>
                  </div>
                </div>
                <div class="custom_select" data-composer-control="duration" hidden>
                  <button class="custom_select_btn" type="button">6s</button>
                  <div class="custom_select_menu">
                    <button class="custom_select_option active" type="button">6s</button>
                    <button class="custom_select_option" type="button">10s</button>
                    <button class="custom_select_option" type="button">12s</button>
                    <button class="custom_select_option" type="button">15s</button>
                  </div>
                </div>
                <div class="composer_option_note" data-composer-control="extend-max-note" hidden>-Max 25s</div>
                <div class="custom_select" data-composer-control="aspect">
                  <button class="custom_select_btn" type="button">Auto</button>
                  <div class="custom_select_menu">
                    <button class="custom_select_option active" type="button">Auto</button>
                    <button class="custom_select_option" type="button">1:1</button>
                    <button class="custom_select_option" type="button">16:9</button>
                    <button class="custom_select_option" type="button">9:16</button>
                    <button class="custom_select_option" type="button">4:3</button>
                    <button class="custom_select_option" type="button">3:4</button>
                    <button class="custom_select_option" type="button">3:2</button>
                    <button class="custom_select_option" type="button">2:3</button>
                  </div>
                </div>
                <div class="custom_select" data-composer-control="image-model">
                  <button class="custom_select_btn" type="button">Quality</button>
                  <div class="custom_select_menu">
                    <button class="custom_select_option active" type="button">Quality</button>
                    <button class="custom_select_option" type="button">Speed</button>
                  </div>
                </div>
                <div class="custom_select" data-composer-control="resolution">
                  <button class="custom_select_btn" type="button">1k</button>
                  <div class="custom_select_menu">
                    <button class="custom_select_option active" type="button">1k</button>
                    <button class="custom_select_option" type="button">2k</button>
                  </div>
                </div>
                <div class="custom_select" data-composer-control="count">
                  <button class="custom_select_btn" type="button">Auto</button>
                  <div class="custom_select_menu">
                    <button class="custom_select_option active" type="button">Auto</button>
                    <button class="custom_select_option" type="button">1</button>
                    <button class="custom_select_option" type="button">2</button>
                    <button class="custom_select_option" type="button">4</button>
                    <button class="custom_select_option" type="button">8</button>
                    <button class="custom_select_option" type="button">10</button>
                  </div>
                </div>
                <div class="composer_option_note" data-composer-control="video-edit-note" hidden>-Max 8.7s / 720p</div>
              </div>
            </div>
          </div>
        </section>

      </main>
    </div>

    <div id="toast" class="toast" hidden></div>
  </body>
</html>
