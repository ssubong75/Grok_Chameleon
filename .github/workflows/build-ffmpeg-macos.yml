name: Build ffmpeg (macOS, LGPL)

# Produces the static LGPL ffmpeg bundled at app/vendor/ffmpeg/.
# Run manually; the binary is committed to the repo, not rebuilt per release.

on:
  workflow_dispatch:
    inputs:
      ffmpeg_version:
        description: FFmpeg release to build
        required: false
        default: "8.1.1"

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Fetch source
        run: |
          set -e
          curl -fsSL -o ffmpeg.tar.xz "https://ffmpeg.org/releases/ffmpeg-${{ inputs.ffmpeg_version }}.tar.xz"
          tar xf ffmpeg.tar.xz
          mv "ffmpeg-${{ inputs.ffmpeg_version }}" src

      - name: Configure (LGPL, static, mp4 stream copy + first-frame poster)
        run: |
          set -e
          cd src
          ./configure \
            --disable-autodetect \
            --disable-everything \
            --disable-doc --disable-network --disable-debug \
            --disable-ffplay --disable-ffprobe \
            --disable-shared --enable-static \
            --enable-protocol=file \
            --enable-demuxer=mov --enable-muxer=mp4,image2 \
            --enable-bsf=aac_adtstoasc,h264_mp4toannexb,hevc_mp4toannexb,extract_extradata \
            --enable-decoder=h264,hevc,mjpeg \
            --enable-parser=h264,hevc,mjpeg \
            --enable-encoder=mjpeg \
            --enable-filter=scale \
            | tee configure.out

      - name: Fail if the build is not LGPL
        run: |
          set -e
          cd src
          grep -q "License: LGPL version 2.1 or later" configure.out
          if grep -qi "enable-gpl\|nonfree" configure.out; then
            echo "GPL or non-free component detected" >&2
            exit 1
          fi

      - name: Build
        run: |
          set -e
          cd src
          make -j"$(sysctl -n hw.ncpu)"

      - name: Verify the binary
        run: |
          set -e
          cd src
          file ffmpeg | grep -q "arm64"
          ./ffmpeg -hide_banner -version | head -3
          ./ffmpeg -hide_banner -muxers   | grep -q " mp4 "
          ./ffmpeg -hide_banner -muxers   | grep -q " image2 "
          ./ffmpeg -hide_banner -demuxers | grep -q " mov,"
          ./ffmpeg -hide_banner -decoders | grep -q " h264 "
          ./ffmpeg -hide_banner -decoders | grep -q " hevc "
          ./ffmpeg -hide_banner -encoders | grep -q " mjpeg "
          ./ffmpeg -hide_banner -filters  | grep -q " scale "
          ls -l ffmpeg

      - name: Functional check -- decode+scale+mjpeg against a real h264 source
        run: |
          set -e
          brew install ffmpeg
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "testsrc=size=1280x720:rate=30" \
            -t 1 -c:v libx264 -pix_fmt yuv420p -movflags +faststart test_source.mp4
          cd src
          ./ffmpeg -hide_banner -loglevel error -nostdin -y \
            -i ../test_source.mp4 \
            -map 0:v:0 -an -sn -dn -frames:v 1 \
            -vf "scale=960:960:force_original_aspect_ratio=decrease" \
            -q:v 3 poster.jpg
          ls -l poster.jpg

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-macos-lgpl
          path: |
            src/ffmpeg
            src/COPYING.LGPLv2.1
            src/poster.jpg
          if-no-files-found: error
