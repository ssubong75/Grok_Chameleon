              exit 1
            fi
            kill "$open_pid" 2>/dev/null || true
            wait "$open_pid" 2>/dev/null || true
            for attempt in {1..40}; do
              if ! mount | grep -F "$archive_utility_main on " >/dev/null; then
                break
              fi
              sleep 0.25
            done
            if mount | grep -F "$archive_utility_main on "; then
              echo "AppTranslocation mount remained after clean shutdown on cycle $cycle." >&2
              exit 1
            fi
          }

          launch_and_quit once

          shasum -a 256 "output/$OUTPUT_ZIP"

      - name: Retain the verified Mac build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: output/${{ matrix.output_zip }}
          if-no-files-found: error
          retention-days: 3

  publish:
    environment: release-update-approval
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - build-windows
      - build-macos
    steps:
      - name: Check out the release notes
        uses: actions/checkout@v4

      - name: Download the verified Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: release/windows

      - name: Download the verified Mac build
        uses: actions/download-artifact@v4
        with:
          name: mac-build
          path: release/macos

      - name: Publish the two verified release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: Grok_Chameleon
          RELEASE_TITLE: Grok Chameleon
          RELEASE_NOTES: .github/release-notes.md
          WIN_ZIP: Win_Grok_Chameleon.zip
          MAC_ZIP: Mac_Grok_Chameleon.zip
          STALE_ZIPS: "Win_Grok_Chameleon_C_v2.0.zip Mac_Grok_Chameleon_C_v2.0.zip Win_Grok_Chameleon_v2.0.zip Mac_Grok_Chameleon_v2.0.zip"
          WIN_INPUT_SHA256: ${{ needs.build-windows.outputs.input_sha256 }}
          MAC_INPUT_SHA256: ${{ needs.build-macos.outputs.input_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p current/win current/mac
          release_existed=false
          assets_existed=false
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_existed=true
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TITLE" --notes-file "$RELEASE_NOTES" --latest
            # A release seeded from the retired tag has no assets of its own yet.
            if gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$WIN_ZIP" --dir current/win \
              && gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$MAC_ZIP" --dir current/mac; then
              assets_existed=true
              test "$(sha256sum "current/win/$WIN_ZIP" | awk '{print $1}')" = "$WIN_INPUT_SHA256"
              test "$(sha256sum "current/mac/$MAC_ZIP" | awk '{print $1}')" = "$MAC_INPUT_SHA256"
            fi
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --notes-file "$RELEASE_NOTES" --latest
          fi

          rollback() {
            echo 'Rolling back the release assets.' >&2
            if [[ "$assets_existed" == true ]]; then
              gh release upload "$RELEASE_TAG" "current/win/$WIN_ZIP" --repo "$GITHUB_REPOSITORY" --clobber || true
              gh release upload "$RELEASE_TAG" "current/mac/$MAC_ZIP" --repo "$GITHUB_REPOSITORY" --clobber || true
            elif [[ "$release_existed" == true ]]; then
              gh release delete-asset "$RELEASE_TAG" "$WIN_ZIP" --repo "$GITHUB_REPOSITORY" --yes || true
              gh release delete-asset "$RELEASE_TAG" "$MAC_ZIP" --repo "$GITHUB_REPOSITORY" --yes || true
            else
              gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
            fi
          }
          trap rollback ERR
          gh release upload "$RELEASE_TAG" "release/windows/$WIN_ZIP" --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$RELEASE_TAG" "release/macos/$MAC_ZIP" --repo "$GITHUB_REPOSITORY" --clobber
          remote_digest() {
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name == "'"$1"'") | .digest'
          }
          win_local="sha256:$(sha256sum "release/windows/$WIN_ZIP" | awk '{print $1}')"
          mac_local="sha256:$(sha256sum "release/macos/$MAC_ZIP" | awk '{print $1}')"
          win_remote="$(remote_digest "$WIN_ZIP")"
          mac_remote="$(remote_digest "$MAC_ZIP")"
          test "$win_local" = "$win_remote"
          test "$mac_local" = "$mac_remote"
          # Asset names used before this pipeline moved to the single Grok_Chameleon
          # release. Drop them once the replacement upload above is verified good.
          for stale in $STALE_ZIPS; do
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$stale"; then
              gh release delete-asset "$RELEASE_TAG" "$stale" --repo "$GITHUB_REPOSITORY" --yes
            fi
          done
          asset_names="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          test "$(printf '%s\n' "$asset_names" | grep -Fxc "$WIN_ZIP")" -eq 1
          test "$(printf '%s\n' "$asset_names" | grep -Fxc "$MAC_ZIP")" -eq 1
          test "$(printf '%s\n' "$asset_names" | sed '/^$/d' | wc -l | tr -d ' ')" -eq 2
          if printf '%s\n' "$asset_names" | grep -Eq '(^|_)u\.zip$'; then
            echo 'Unexpected U release asset found.' >&2
            exit 1
          fi
          trap - ERR
          echo "windows-digest=$win_remote"
          echo "mac-digest=$mac_remote"

  verify-published-macos:
    runs-on: macos-15
    timeout-minutes: 35
    needs:
      - publish
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            common_dir: common
            mac_zip: Mac_Grok_Chameleon.zip
    env:
      RELEASE_TAG: Grok_Chameleon
      MAC_ZIP: ${{ matrix.mac_zip }}
      VARIANT_COMMON_DIR: ${{ matrix.common_dir }}

    steps:
      - name: Check out the exact shared source commit
        uses: actions/checkout@v4

      - name: Download and verify the actual published Mac ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export COPYFILE_DISABLE=1
          published_dir="$RUNNER_TEMP/published-release"
          ditto_dir="$RUNNER_TEMP/ditto-extracted"
          archive_dir="$RUNNER_TEMP/archive-utility-extracted"
          mkdir -p "$published_dir" "$ditto_dir" "$archive_dir"

          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$MAC_ZIP" \
            --dir "$published_dir"
          published_zip="$published_dir/$MAC_ZIP"
          local_digest="sha256:$(shasum -a 256 "$published_zip" | awk '{print $1}')"
          remote_digest="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name == "'"$MAC_ZIP"'") | .digest')"
          test -n "$remote_digest"
          test "$local_digest" = "$remote_digest"

          unzip -t "$published_zip" >/dev/null
          if zipinfo -1 "$published_zip" | grep -E '(^|/)(__MACOSX|\._|\.DS_Store)(/|$)'; then
            echo 'Forbidden AppleDouble or Finder metadata exists in the published ZIP.' >&2
            exit 1
          fi
          top_levels="$(zipinfo -1 "$published_zip" | sed '/^$/d' | cut -d/ -f1 | sort -u)"
          test "$top_levels" = 'Grok Chameleon'

          ditto -x -k "$published_zip" "$ditto_dir"
          root="$ditto_dir/Grok Chameleon"
          main_app="$root/Grok Chameleon.app"
          app_root="$main_app/Contents/Resources/app"
          main_exec="$main_app/Contents/MacOS/Grok Chameleon"
          python_exec="$main_app/Contents/Resources/Python/bin/python3"
          common_root="$GITHUB_WORKSPACE/$VARIANT_COMMON_DIR/app"
          shared_relatives=(
            electron/main.js
            electron/preload-bridge.js
            runtime/server.py
            runtime/library_index.py
            runtime/imagine_state.py
            runtime/imagine_accounts.py
            runtime/imagine_routes.py
            web/index.html
            web/styles/app.css
            web/scripts/state.js
            web/scripts/build_main.js
            web/scripts/b_composer_submit.js
            web/scripts/b_source_render.js
            web/scripts/b_detail_actions.js
            web/scripts/sidebar_events.js
            web/styles/sidebar.css
            web/scripts/collection_events.js
            web/scripts/collection_render.js
            web/styles/collection.css
            web/styles/main.css
            web/scripts/card_render.js
            web/scripts/detail_common_actions.js
            web/scripts/card_actions.js
            web/scripts/screen_events.js
            web/scripts/screen_router.js
            web/scripts/navigation_history.js
            web/scripts/i_detail_actions.js
            web/scripts/composer_events.js
            web/scripts/composer_provider.js
            web/styles/cards_prompt.css
            web/scripts/composer_options.js
            web/scripts/composer_attachments.js
            web/scripts/i_composer_submit.js
            web/scripts/library_core.js
            web/scripts/prompt_translate.js
            web/scripts/library_scan.js
            web/scripts/detail_state.js
            web/scripts/detail_media.js
            web/scripts/detail_video_player.js
            web/scripts/detail_events.js
            web/scripts/detail_navigation.js
            web/scripts/detail_render.js
            web/styles/detail.css
            web/scripts/i_source_render.js
            web/scripts/imagine_main.js
            web/scripts/render.js
            web/scripts/collection_actions.js
            web/scripts/image_editor_flow.js
            web/scripts/search_render.js
            web/scripts/prompt_events.js
            web/scripts/prompt_account.js
            web/scripts/account_core.js
            web/scripts/ui_feedback.js
            web/styles/account.css
            web/styles/composer.css
            vendor/ffmpeg/ffmpeg
            vendor/ffmpeg/COPYING.LGPLv2.1
          )

          test -d "$root"
          test -d "$main_app"
          test -d "$app_root"
          test -f "$main_app/Contents/Info.plist"
          test -x "$main_exec"
          test -x "$python_exec"
          test -L "$main_app/Contents/Frameworks/Electron Framework.framework/Versions/Current"
          test -L "$main_app/Contents/Frameworks/Electron Framework.framework/Electron Framework"
          find "$app_root/vendor/python" -type f -name '*darwin.so' -print -quit | grep -q .
          plutil -lint "$main_app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$main_app/Contents/Info.plist")" = 'local.grokchameleon.app'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$main_app/Contents/Info.plist")" = '2.0.0'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$main_app/Contents/Info.plist")" = '2'
          codesign --verify --deep --strict --verbose=4 "$main_app"

          broken_links=0
          while IFS= read -r -d '' link; do
            if [[ ! -e "$link" ]]; then
              echo "Broken symbolic link: $link" >&2
              broken_links=1
            fi
          done < <(find "$root" -type l -print0)
          test "$broken_links" -eq 0

          if find "$root" \( -name '__MACOSX' -o -name '._*' -o -name '.DS_Store' -o -name '__pycache__' \) -print | grep -q .; then
            echo 'Forbidden metadata exists after ditto extraction.' >&2
            exit 1
          fi
          for relative in "${shared_relatives[@]}"; do
            cmp "$common_root/$relative" "$app_root/$relative"
            if [[ "$relative" == *.js ]]; then
              node --check "$app_root/$relative"
            fi
          done
          "$python_exec" -c 'import sys; print("PUBLISHED_MAC_PYTHON_OK", sys.version_info[:3])'
          ELECTRON_RUN_AS_NODE=1 "$main_exec" -e 'console.log("PUBLISHED_MAC_ELECTRON_OK")'

          cp "$published_zip" "$archive_dir/$MAC_ZIP"
          quarantined_zip="$archive_dir/$MAC_ZIP"
          xattr -w com.apple.quarantine '0081;00000000;Chrome;' "$quarantined_zip"
          open -W -a 'Archive Utility' "$quarantined_zip"
          archive_root="$archive_dir/Grok Chameleon"
          archive_app="$archive_root/Grok Chameleon.app"
          archive_exec="$archive_app/Contents/MacOS/Grok Chameleon"
          test -d "$archive_root"
          test -d "$archive_app/Contents/Resources/app"
          test -x "$archive_exec"
          test -L "$archive_app/Contents/Frameworks/Electron Framework.framework/Versions/Current"
          test -L "$archive_app/Contents/Frameworks/Electron Framework.framework/Electron Framework"
          codesign --verify --deep --strict --verbose=4 "$archive_app"
          if find "$archive_root" \( -name '__MACOSX' -o -name '._*' -o -name '.DS_Store' -o -name '__pycache__' \) -print | grep -q .; then
            echo 'Forbidden metadata exists after Archive Utility extraction.' >&2
            exit 1
          fi

          echo "published-mac-digest=$remote_digest"
          echo 'published-mac-verification=passed'
