name: Grok Chameleon

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: grok-chameleon-release
  cancel-in-progress: false

env:
  COMMON_MAIN: common/app/electron/main.js
  COMMON_INDEX: common/app/web/index.html
  COMMON_APP_STYLE: common/app/web/styles/app.css
  COMMON_STATE: common/app/web/scripts/state.js
  COMMON_BUILD_MAIN: common/app/web/scripts/build_main.js
  COMMON_B_SUBMIT: common/app/web/scripts/b_composer_submit.js
  COMMON_B_SOURCE: common/app/web/scripts/b_source_render.js
  COMMON_B_DETAIL_ACTIONS: common/app/web/scripts/b_detail_actions.js
  COMMON_SIDEBAR_EVENTS: common/app/web/scripts/sidebar_events.js
  COMMON_SIDEBAR_STYLE: common/app/web/styles/sidebar.css
  COMMON_COLLECTION_EVENTS: common/app/web/scripts/collection_events.js
  COMMON_COLLECTION_RENDER: common/app/web/scripts/collection_render.js
  COMMON_COLLECTION_STYLE: common/app/web/styles/collection.css
  COMMON_MAIN_STYLE: common/app/web/styles/main.css
  COMMON_CARD_RENDER: common/app/web/scripts/card_render.js
  COMMON_DETAIL_COMMON_ACTIONS: common/app/web/scripts/detail_common_actions.js
  COMMON_CARD_ACTIONS: common/app/web/scripts/card_actions.js
  COMMON_SCREEN_EVENTS: common/app/web/scripts/screen_events.js
  COMMON_SCREEN_ROUTER: common/app/web/scripts/screen_router.js
  COMMON_NAVIGATION_HISTORY: common/app/web/scripts/navigation_history.js
  COMMON_I_DETAIL_ACTIONS: common/app/web/scripts/i_detail_actions.js
  COMMON_COMPOSER_EVENTS: common/app/web/scripts/composer_events.js
  COMMON_COMPOSER_PROVIDER: common/app/web/scripts/composer_provider.js
  COMMON_CARDS_PROMPT_STYLE: common/app/web/styles/cards_prompt.css
  COMMON_COMPOSER: common/app/web/scripts/composer_options.js
  COMMON_ATTACHMENTS: common/app/web/scripts/composer_attachments.js
  COMMON_I_SUBMIT: common/app/web/scripts/i_composer_submit.js
  COMMON_LIBRARY_CORE: common/app/web/scripts/library_core.js
  COMMON_LIBRARY_SCAN: common/app/web/scripts/library_scan.js
  COMMON_DETAIL_STATE: common/app/web/scripts/detail_state.js
  COMMON_DETAIL_MEDIA: common/app/web/scripts/detail_media.js
  COMMON_DETAIL_VIDEO_PLAYER: common/app/web/scripts/detail_video_player.js
  COMMON_DETAIL_EVENTS: common/app/web/scripts/detail_events.js
  COMMON_DETAIL_NAVIGATION: common/app/web/scripts/detail_navigation.js
  COMMON_DETAIL_RENDER: common/app/web/scripts/detail_render.js
  COMMON_DETAIL_STYLE: common/app/web/styles/detail.css
  COMMON_I_SOURCE: common/app/web/scripts/i_source_render.js
  COMMON_IMAGINE_MAIN: common/app/web/scripts/imagine_main.js
  COMMON_RENDER: common/app/web/scripts/render.js
  COMMON_COLLECTION_ACTIONS: common/app/web/scripts/collection_actions.js
  COMMON_IMAGE_EDITOR_FLOW: common/app/web/scripts/image_editor_flow.js
  COMMON_SEARCH_RENDER: common/app/web/scripts/search_render.js
  COMMON_PROMPT_TRANSLATE: common/app/web/scripts/prompt_translate.js
  COMMON_PROMPT_EVENTS: common/app/web/scripts/prompt_events.js
  COMMON_UI_FEEDBACK: common/app/web/scripts/ui_feedback.js
  COMMON_ACCOUNT_STYLE: common/app/web/styles/account.css
  COMMON_COMPOSER_STYLE: common/app/web/styles/composer.css
  COMMON_PRELOAD: common/app/electron/preload-bridge.js
  COMMON_SERVER: common/app/runtime/server.py
  COMMON_LIBRARY_INDEX: common/app/runtime/library_index.py
  COMMON_IMAGINE_STATE: common/app/runtime/imagine_state.py
  COMMON_IMAGINE_ACCOUNTS: common/app/runtime/imagine_accounts.py
  COMMON_IMAGINE_ROUTES: common/app/runtime/imagine_routes.py
  COMMON_PROMPT_ACCOUNT: common/app/web/scripts/prompt_account.js
  COMMON_ACCOUNT_CORE: common/app/web/scripts/account_core.js
  COMMON_FFMPEG_WIN: common/app/vendor/ffmpeg/ffmpeg.exe
  COMMON_FFMPEG_LICENSE: common/app/vendor/ffmpeg/COPYING.LGPLv2.1

jobs:
  build-windows:
    runs-on: windows-2025
    timeout-minutes: 35
    outputs:
      input_sha256: ${{ steps.windows_input.outputs.sha256 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            common_dir: common
            output_zip: Win_Grok_Chameleon.zip
            artifact: windows-build
    env:
      RELEASE_TAG: Grok_Chameleon
      INPUT_ZIP: Win_Grok_Chameleon.zip
      OUTPUT_ZIP: ${{ matrix.output_zip }}
      VARIANT_COMMON_DIR: ${{ matrix.common_dir }}

    steps:
      - name: Check out the shared source commit
        uses: actions/checkout@v4

      - name: Download the exact Windows runtime package
        id: windows_input
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force input | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern $env:INPUT_ZIP --dir input
          if ($LASTEXITCODE -ne 0) { throw "Windows release download failed." }
          $inputZip = Join-Path $env:GITHUB_WORKSPACE "input\$env:INPUT_ZIP"
          $inputHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $inputZip).Hash.ToLowerInvariant()
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "sha256=$inputHash" -Encoding utf8

      - name: Assemble and verify Windows from the shared source
        shell: pwsh
        env:
          EXPECTED_INPUT_SHA256: ${{ steps.windows_input.outputs.sha256 }}
        run: |
          $ErrorActionPreference = "Stop"
          $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
          New-Item -ItemType Directory -Force unpack, output, verify | Out-Null
          $inputZip = Join-Path $env:GITHUB_WORKSPACE "input\$env:INPUT_ZIP"
          $outputZip = Join-Path $env:GITHUB_WORKSPACE "output\$env:OUTPUT_ZIP"
          $root = Join-Path $env:GITHUB_WORKSPACE "unpack\Grok Chameleon"
          $appRoot = Join-Path $root "Resources\Grok Chameleon\resources\app"
          $state = Join-Path $appRoot "web\scripts\state.js"
          $outerExe = Join-Path $root "Grok Chameleon.exe"
          $innerExe = Join-Path $root "Resources\Grok Chameleon\Grok Chameleon.exe"
          $windowsSvgArrowPatch = Join-Path $env:GITHUB_WORKSPACE "tools\patch_windows_svg_arrows.py"
          $sharedSources = @(
            @{ Name = "main"; Relative = "electron\main.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_MAIN) },
            @{ Name = "preload"; Relative = "electron\preload-bridge.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_PRELOAD) },
            @{ Name = "server"; Relative = "runtime\server.py"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_SERVER) },
            @{ Name = "library_index"; Relative = "runtime\library_index.py"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_LIBRARY_INDEX) },
            @{ Name = "imagine_state"; Relative = "runtime\imagine_state.py"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_IMAGINE_STATE) },
            @{ Name = "imagine_accounts"; Relative = "runtime\imagine_accounts.py"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_IMAGINE_ACCOUNTS) },
            @{ Name = "imagine_routes"; Relative = "runtime\imagine_routes.py"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_IMAGINE_ROUTES) },
            @{ Name = "index"; Relative = "web\index.html"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_INDEX) },
            @{ Name = "app_style"; Relative = "web\styles\app.css"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_APP_STYLE) },
            @{ Name = "state"; Relative = "web\scripts\state.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_STATE) },
            @{ Name = "build_main"; Relative = "web\scripts\build_main.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_BUILD_MAIN) },
            @{ Name = "b_submit"; Relative = "web\scripts\b_composer_submit.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_B_SUBMIT) },
            @{ Name = "b_source"; Relative = "web\scripts\b_source_render.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_B_SOURCE) },
            @{ Name = "b_detail_actions"; Relative = "web\scripts\b_detail_actions.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_B_DETAIL_ACTIONS) },
            @{ Name = "sidebar_events"; Relative = "web\scripts\sidebar_events.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_SIDEBAR_EVENTS) },
            @{ Name = "sidebar_style"; Relative = "web\styles\sidebar.css"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_SIDEBAR_STYLE) },
            @{ Name = "collection_events"; Relative = "web\scripts\collection_events.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_COLLECTION_EVENTS) },
            @{ Name = "collection_render"; Relative = "web\scripts\collection_render.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_COLLECTION_RENDER) },
            @{ Name = "collection_style"; Relative = "web\styles\collection.css"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_COLLECTION_STYLE) },
            @{ Name = "main_style"; Relative = "web\styles\main.css"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_MAIN_STYLE) },
            @{ Name = "card_render"; Relative = "web\scripts\card_render.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_CARD_RENDER) },
            @{ Name = "detail_common_actions"; Relative = "web\scripts\detail_common_actions.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_DETAIL_COMMON_ACTIONS) },
            @{ Name = "card_actions"; Relative = "web\scripts\card_actions.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_CARD_ACTIONS) },
            @{ Name = "screen_events"; Relative = "web\scripts\screen_events.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_SCREEN_EVENTS) },
            @{ Name = "screen_router"; Relative = "web\scripts\screen_router.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_SCREEN_ROUTER) },
            @{ Name = "navigation_history"; Relative = "web\scripts\navigation_history.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_NAVIGATION_HISTORY) },
            @{ Name = "i_detail_actions"; Relative = "web\scripts\i_detail_actions.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_I_DETAIL_ACTIONS) },
            @{ Name = "composer_events"; Relative = "web\scripts\composer_events.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_COMPOSER_EVENTS) },
            @{ Name = "composer_provider"; Relative = "web\scripts\composer_provider.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_COMPOSER_PROVIDER) },
            @{ Name = "cards_prompt_style"; Relative = "web\styles\cards_prompt.css"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_CARDS_PROMPT_STYLE) },
            @{ Name = "composer"; Relative = "web\scripts\composer_options.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_COMPOSER) },
            @{ Name = "attachments"; Relative = "web\scripts\composer_attachments.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_ATTACHMENTS) },
            @{ Name = "i_submit"; Relative = "web\scripts\i_composer_submit.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_I_SUBMIT) },
            @{ Name = "library_core"; Relative = "web\scripts\library_core.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_LIBRARY_CORE) },
            @{ Name = "prompt_translate"; Relative = "web\scripts\prompt_translate.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_PROMPT_TRANSLATE) },
            @{ Name = "library_scan"; Relative = "web\scripts\library_scan.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_LIBRARY_SCAN) },
            @{ Name = "detail_state"; Relative = "web\scripts\detail_state.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_DETAIL_STATE) },
            @{ Name = "detail_media"; Relative = "web\scripts\detail_media.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_DETAIL_MEDIA) },
            @{ Name = "detail_video_player"; Relative = "web\scripts\detail_video_player.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_DETAIL_VIDEO_PLAYER) },
            @{ Name = "detail_events"; Relative = "web\scripts\detail_events.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_DETAIL_EVENTS) },
            @{ Name = "detail_navigation"; Relative = "web\scripts\detail_navigation.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_DETAIL_NAVIGATION) },
            @{ Name = "detail_render"; Relative = "web\scripts\detail_render.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_DETAIL_RENDER) },
            @{ Name = "detail_style"; Relative = "web\styles\detail.css"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_DETAIL_STYLE) },
            @{ Name = "i_source"; Relative = "web\scripts\i_source_render.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_I_SOURCE) },
            @{ Name = "imagine_main"; Relative = "web\scripts\imagine_main.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_IMAGINE_MAIN) },
            @{ Name = "render"; Relative = "web\scripts\render.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_RENDER) },
            @{ Name = "collection_actions"; Relative = "web\scripts\collection_actions.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_COLLECTION_ACTIONS) },
            @{ Name = "image_editor_flow"; Relative = "web\scripts\image_editor_flow.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_IMAGE_EDITOR_FLOW) },
            @{ Name = "search_render"; Relative = "web\scripts\search_render.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_SEARCH_RENDER) },
            @{ Name = "prompt_events"; Relative = "web\scripts\prompt_events.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_PROMPT_EVENTS) },
            @{ Name = "prompt_account"; Relative = "web\scripts\prompt_account.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_PROMPT_ACCOUNT) },
            @{ Name = "account_core"; Relative = "web\scripts\account_core.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_ACCOUNT_CORE) },
            @{ Name = "ui_feedback"; Relative = "web\scripts\ui_feedback.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_UI_FEEDBACK) },
            @{ Name = "account_style"; Relative = "web\styles\account.css"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_ACCOUNT_STYLE) },
            @{ Name = "composer_style"; Relative = "web\styles\composer.css"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_COMPOSER_STYLE) },
            @{ Name = "ffmpeg"; Relative = "vendor\ffmpeg\ffmpeg.exe"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_FFMPEG_WIN) },
            @{ Name = "ffmpeg_license"; Relative = "vendor\ffmpeg\COPYING.LGPLv2.1"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_FFMPEG_LICENSE) }
          )
          # The COMMON_* variables already name common; VARIANT_COMMON_DIR is redundant with
          # a single variant but kept so a future variant only needs a new matrix entry.
          $variantRoot = Join-Path $env:GITHUB_WORKSPACE $env:VARIANT_COMMON_DIR
          foreach ($shared in $sharedSources) {
            $shared.Target = Join-Path $appRoot $shared.Relative
            $shared.Source = Join-Path $variantRoot (Join-Path "app" $shared.Relative)
          }
          $targetMain = ($sharedSources | Where-Object Name -eq "main").Target
          $targetPreload = ($sharedSources | Where-Object Name -eq "preload").Target
          $targetServer = ($sharedSources | Where-Object Name -eq "server").Target
          $targetLibraryIndex = ($sharedSources | Where-Object Name -eq "library_index").Target
          $targetImagineState = ($sharedSources | Where-Object Name -eq "imagine_state").Target
          $targetImagineAccounts = ($sharedSources | Where-Object Name -eq "imagine_accounts").Target
          $targetImagineRoutes = ($sharedSources | Where-Object Name -eq "imagine_routes").Target
          $targetPromptAccount = ($sharedSources | Where-Object Name -eq "prompt_account").Target
          $targetAccountCore = ($sharedSources | Where-Object Name -eq "account_core").Target
          $targetIndex = ($sharedSources | Where-Object Name -eq "index").Target
          $targetState = ($sharedSources | Where-Object Name -eq "state").Target
          $targetBuildMain = ($sharedSources | Where-Object Name -eq "build_main").Target
          $targetBSubmit = ($sharedSources | Where-Object Name -eq "b_submit").Target
          $targetBSource = ($sharedSources | Where-Object Name -eq "b_source").Target
          $targetSidebarEvents = ($sharedSources | Where-Object Name -eq "sidebar_events").Target
          $targetMainStyle = ($sharedSources | Where-Object Name -eq "main_style").Target
          $targetCardRender = ($sharedSources | Where-Object Name -eq "card_render").Target
          $targetIDetailActions = ($sharedSources | Where-Object Name -eq "i_detail_actions").Target
          $targetComposerEvents = ($sharedSources | Where-Object Name -eq "composer_events").Target
          $targetCardsPromptStyle = ($sharedSources | Where-Object Name -eq "cards_prompt_style").Target
          $targetComposer = ($sharedSources | Where-Object Name -eq "composer").Target
          $targetAttachments = ($sharedSources | Where-Object Name -eq "attachments").Target
          $targetISubmit = ($sharedSources | Where-Object Name -eq "i_submit").Target
          $targetLibraryCore = ($sharedSources | Where-Object Name -eq "library_core").Target
          $targetLibraryScan = ($sharedSources | Where-Object Name -eq "library_scan").Target
          $targetCollectionRender = ($sharedSources | Where-Object Name -eq "collection_render").Target
          $targetDetailState = ($sharedSources | Where-Object Name -eq "detail_state").Target
          $targetDetailMedia = ($sharedSources | Where-Object Name -eq "detail_media").Target
          $targetDetailNavigation = ($sharedSources | Where-Object Name -eq "detail_navigation").Target
          $targetDetailRender = ($sharedSources | Where-Object Name -eq "detail_render").Target
          $targetDetailStyle = ($sharedSources | Where-Object Name -eq "detail_style").Target
          $targetISource = ($sharedSources | Where-Object Name -eq "i_source").Target
          $targetCollectionActions = ($sharedSources | Where-Object Name -eq "collection_actions").Target
          $targetSearchRender = ($sharedSources | Where-Object Name -eq "search_render").Target
          $targetPromptEvents = ($sharedSources | Where-Object Name -eq "prompt_events").Target
          $targetUiFeedback = ($sharedSources | Where-Object Name -eq "ui_feedback").Target
          $targetAccountStyle = ($sharedSources | Where-Object Name -eq "account_style").Target

          $inputHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $inputZip).Hash.ToLowerInvariant()
          if ($inputHash -ne $env:EXPECTED_INPUT_SHA256) { throw "Windows input digest changed: $inputHash" }
          & $sevenZip t $inputZip
          if ($LASTEXITCODE -ne 0) { throw "Windows input ZIP CRC check failed." }
          & $sevenZip x -y "-o$env:GITHUB_WORKSPACE\unpack" $inputZip
          if ($LASTEXITCODE -ne 0) { throw "Windows extraction failed." }
          foreach ($required in @($sharedSources.Source + @(
            $state,
            $outerExe,
            $innerExe,
            $windowsSvgArrowPatch
          ))) {
            if (-not (Test-Path -LiteralPath $required)) { throw "Missing required file: $required" }
          }

          $exeHashes = @{
            outer = (Get-FileHash -Algorithm SHA256 -LiteralPath $outerExe).Hash
            inner = (Get-FileHash -Algorithm SHA256 -LiteralPath $innerExe).Hash
          }
          $sharedHashes = @{}
          foreach ($shared in $sharedSources) {
            $sharedDir = Split-Path -Parent $shared.Target
            if (-not (Test-Path -LiteralPath $sharedDir)) {
              New-Item -ItemType Directory -Force -Path $sharedDir | Out-Null
            }
            Copy-Item -Force -LiteralPath $shared.Source -Destination $shared.Target
            $sharedHashes[$shared.Name] = (Get-FileHash -Algorithm SHA256 -LiteralPath $shared.Source).Hash
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $shared.Target).Hash -ne $sharedHashes[$shared.Name]) {
              throw "Windows shared source copy mismatch: $($shared.Name)"
            }
          }
          foreach ($migrationPath in @(
            (Join-Path $root "Resources\Migration"),
            (Join-Path $root "Migration.exe")
          )) {
            if (Test-Path -LiteralPath $migrationPath) {
              Remove-Item -Recurse -Force -LiteralPath $migrationPath
            }
          }
          foreach ($portableResidue in @(
            (Join-Path $root ".library_path.json"),
            (Join-Path $root "library_path.json"),
            (Join-Path $root "runtime_data"),
            (Join-Path $root "sql_data")
          )) {
            if (Test-Path -LiteralPath $portableResidue) {
              Remove-Item -Recurse -Force -LiteralPath $portableResidue
            }
          }
          python $windowsSvgArrowPatch --app-root $appRoot
          if ($LASTEXITCODE -ne 0) { throw "Windows SVG arrow patch failed." }
          foreach ($patchedShared in @(
            @{ Name = "index"; Target = $targetIndex },
            @{ Name = "card_render"; Target = $targetCardRender },
            @{ Name = "cards_prompt_style"; Target = $targetCardsPromptStyle },
            @{ Name = "detail_style"; Target = $targetDetailStyle }
          )) {
            $sharedHashes[$patchedShared.Name] = (Get-FileHash -Algorithm SHA256 -LiteralPath $patchedShared.Target).Hash
          }
          foreach ($javascript in $sharedSources | Where-Object { $_.Relative.EndsWith(".js") }) {
            node --check $javascript.Target
            if ($LASTEXITCODE -ne 0) { throw "Windows JavaScript syntax check failed: $($javascript.Relative)" }
          }
          python -c "import ast,pathlib,sys; ast.parse(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'), filename=sys.argv[1])" $targetServer
          if ($LASTEXITCODE -ne 0) { throw "Windows server.py syntax check failed." }
          python -c "import ast,pathlib,sys; ast.parse(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'), filename=sys.argv[1])" $targetLibraryIndex
          if ($LASTEXITCODE -ne 0) { throw "Windows library_index.py syntax check failed." }
          python -c "import ast,pathlib,sys; ast.parse(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'), filename=sys.argv[1])" $targetImagineState
          if ($LASTEXITCODE -ne 0) { throw "Windows imagine_state.py syntax check failed." }
          python -c "import ast,pathlib,sys; ast.parse(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'), filename=sys.argv[1])" $targetImagineAccounts
          if ($LASTEXITCODE -ne 0) { throw "Windows imagine_accounts.py syntax check failed." }
          python -c "import ast,pathlib,sys; ast.parse(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'), filename=sys.argv[1])" $targetImagineRoutes
          if ($LASTEXITCODE -ne 0) { throw "Windows imagine_routes.py syntax check failed." }

          $composerText = Get-Content -Raw -LiteralPath $targetComposer
          foreach ($marker in @(
            'const imageCountOptions = provider === "imagine"',
            '? imagineT2iCountOptions',
            'const imageCountDefault = provider === "imagine" ? "4" : (buildImage20 ? "2" : "5");',
            'setControlVisible(composerControls.count, !isImageToImage'
          )) {
            if (-not $composerText.Contains($marker)) { throw "Windows composer marker missing: $marker" }
          }
          $stateText = Get-Content -Raw -LiteralPath $state
          if (-not $stateText.Contains('const buildT2iCountOptions = ["10", "8", "5", "4", "1"];')) {
            throw "Build count options changed unexpectedly."
          }
          if (-not $stateText.Contains('const imagineT2iCountOptions = ["12", "8", "4", "2"];')) {
            throw "Imagine count options changed unexpectedly."
          }
          $preloadText = Get-Content -Raw -LiteralPath $targetPreload
          foreach ($marker in @(
            "const generationResponseCaptures = [];",
            "conversation_request_route_applied",
            "canonicalContainerId",
            "baselineIds: Array.from(beforeIds)",
            'const beforeIds = allCurrentIds(state, "video");',
            "!tracking.retainTrackedCandidateUntilDeadline",
            'retainTrackedCandidateUntilDeadline: tieredI2vWait || variant.kind === "textToVideo",',
            "const finalEvents = finalContainerIds.flatMap((finalContainerId) => collectStoreEvents("
          )) {
            if (-not $preloadText.Contains($marker)) { throw "Windows relation bridge marker missing: $marker" }
          }
          if ($preloadText.Contains("if (hasInProgressCandidate && now - tracking.firstCandidateSeenAt >= storeObservationMs)")) {
            throw "Windows eight-second video handoff guard is missing."
          }
          $serverText = Get-Content -Raw -LiteralPath $targetServer
          foreach ($marker in @(
            'import imagine_state',
            'def normalize_json_unicode(value):',
            '"database": "sql_data/state.sqlite3"',
            'relation_recovery_action = action in {"i2i", "i2v", "t2v", "extend"}',
            'events, bridge_parent_ids, bridge_baseline_ids, canonical_container_id = native_bridge_fetch_events(',
            'def imagine_generated_relation_baseline_ids(root: Path, source_post_path: str, expected_type: str) -> set[str]:',
            '"relation_count": relation_baseline_count',
            'def imagine_conversation_root_generation(responses: list[dict]) -> dict:',
            '"t2i_group_container": bool(root_generation.get("is_t2i_group_container"))',
            'IMAGINE_DIRECT_I2I_MAX_WAIT_SECONDS = 14',
            'COLLECTION_MOVE_LOCK = threading.Lock()',
            'def thumbnail_file_names(folder: Path, meta: dict | None = None) -> set[str]:',
            'existing = existing_remote_collection_post(target_parent, source_post, items)',
            'def is_grok_preview_image_file_name(name: str) -> bool:',
            'target_parent = root / "created"',
            'def merged_post_source(posts: list[dict]) -> str:',
            'saved_keys = imagine_saved_media_keys_cached(account, max_posts=0)',
            'def build_preview_dir(kind: str, root: Path | None = None) -> Path:',
            'def remove_build_previews_for_tree(root: Path, folder: Path) -> None:',
            'cleaned_items = remove_embedded_preview_files(target_dir, post.get("items") or [])',
            'if parsed.path == "/api/build-preview":',
            'import library_index',
            'def current_library_snapshot(root: Path) -> dict:',
            'def refresh_library_index_paths(',
            'def query_library_posts(payload: dict) -> dict:',
            '"/api/library/posts": query_library_posts',
            '"/api/library/post": get_library_post'
          )) {
            if (-not $serverText.Contains($marker)) { throw "Windows relation recovery marker missing: $marker" }
          }
          $libraryIndexText = Get-Content -Raw -LiteralPath $targetLibraryIndex
          foreach ($marker in @(
            'SCHEMA_VERSION = 7',
            'list_json TEXT NOT NULL',
            'CREATE INDEX IF NOT EXISTS library_posts_parent_idx',
            'def query_posts(',
            'json_column = "data_json" if full else "list_json"'
          )) {
            if (-not $libraryIndexText.Contains($marker)) { throw "Windows library index marker missing: $marker" }
          }
          $imagineStateText = Get-Content -Raw -LiteralPath $targetImagineState
          foreach ($marker in @(
            'STATE_DIRECTORY = "sql_data"',
            'unicodedata.normalize("NFC"',
            'CREATE TABLE IF NOT EXISTS account_registry',
            'def sync_snapshot(root: Path) -> bool:'
          )) {
            if (-not $imagineStateText.Contains($marker)) { throw "Windows SQLite state marker missing: $marker" }
          }
          foreach ($marker in @(
            'ACCOUNT_TIER_SORT_ORDER = {"heavy": 0, "super": 1, "free": 2}',
            'def sort_accounts_by_priority(accounts: list[dict], active_id: str = "") -> list[dict]:',
            'def write_build_auth(root: Path, data: dict, *, preserve_order: bool = False) -> None:',
            'write_build_auth(root, store, preserve_order=True)',
            'def oauth_browser_error(target: dict | None) -> str:',
            'def build_account_is_denied(account: dict | None) -> bool:',
            'failed_build_id = account_id(',
            'verify_imagine_saved_access(normalize_imagine_account({'
          )) {
            if (-not $serverText.Contains($marker)) { throw "Windows account ordering marker missing: $marker" }
          }
          $imagineAccountsText = Get-Content -Raw -LiteralPath $targetImagineAccounts
          foreach ($forbidden in @("supergrokheavy", "freecreditswithsupergrok", "supergrok포함무료크레딧")) {
            if ($imagineAccountsText.Contains($forbidden)) { throw "Windows account tier marketing fallback remains: $forbidden" }
          }
          $promptAccountText = Get-Content -Raw -LiteralPath $targetPromptAccount
          foreach ($marker in @(
            'const accountTierSortOrder = { heavy: 0, super: 1, free: 2 };',
            'function sortAccountCardsByPriority(provider)',
            'row.draggable = true;',
            'if (targetIndex >= 0 && from < targetIndex) to += 1;',
            'if (status === "denied") return "Denied";',
            'if (provider === "build" && status === "denied") {'
          )) {
            if (-not $promptAccountText.Contains($marker)) { throw "Windows account card marker missing: $marker" }
          }
          $accountCoreText = Get-Content -Raw -LiteralPath $targetAccountCore
          foreach ($marker in @(
            'function isDeniedBuildAccount(account)',
            'function firstSelectableBuildAccountId(accounts)'
          )) {
            if (-not $accountCoreText.Contains($marker)) { throw "Windows denied account marker missing: $marker" }
          }
          $mainText = Get-Content -Raw -LiteralPath $targetMain
          foreach ($marker in @(
            "payload.grokChameleonConversationId",
            'process.platform === "darwin"',
            "process.resourcesPath",
            'const LIBRARY_POINTER_PATH = path.join(PORTABLE_ROOT, ".library_path.json");',
            '? path.join(SELECTED_LIBRARY_ROOT, "runtime_data")',
            'app.setPath("userData", ELECTRON_SESSION_ROOT);',
            'app.setPath("sessionData", ELECTRON_SESSION_ROOT);',
            "function verifiedLibraryCardPreviewCacheDir(info = {})",
            'function verifiedLibraryBuildPreviewDir(info = {}, kind = "card")',
            'const expectedCacheDir = path.resolve(resolvedLibraryRoot, "cache", "card-previews");',
            'normalizedKind === "thumbnail" ? "thumbnails" : "cards"',
            'function macBundleLastUsedTime(bundlePath)',
            'function scheduleCardPreviewCachePrune(cacheDir, protectedPath = "")',
            'void pruneCardPreviewCacheAtStartup();'
          )) {
            if (-not $mainText.Contains($marker)) { throw "Cross-platform main marker missing: $marker" }
          }
          if ($mainText.Contains("clearCurrentCardPreviewCache(")) {
            throw "Card preview cache deletion remains in main.js."
          }
          if (-not (Get-Content -Raw -LiteralPath $targetCardRender).Contains("storedBackTarget.scrollTop = scrollTop")) { throw "Imagine detail source scroll capture marker missing." }
          if (-not (Get-Content -Raw -LiteralPath $targetIDetailActions).Contains("function restoreImagineListScrollForScreen(screenId, scrollTop)")) { throw "Imagine detail source scroll restore marker missing." }
          if (-not (Get-Content -Raw -LiteralPath $targetIDetailActions).Contains("restoreImagineListScrollForScreen(returnScreenId, returnScrollTop)")) { throw "Unsaved heart scroll restore call missing." }
          $composerEventsText = Get-Content -Raw -LiteralPath $targetComposerEvents
          foreach ($marker in @(
            "function syncComposerScrollClearance()",
            ".i_discover_card_list, .prompt_card_list, .second_main_card_list",
            '"prompt_main"',
            '"2nd_main"'
          )) {
            if (-not $composerEventsText.Contains($marker)) { throw "Composer scroll clearance marker missing: $marker" }
          }
          $cardsPromptStyleText = Get-Content -Raw -LiteralPath $targetCardsPromptStyle
          foreach ($marker in @(
            "--composer-scroll-clearance",
            ".search_card_list,",
            ".i_discover_card_list,",
            ".i_unsaved_card_list,",
            ".prompt_card_list,",
            ".second_main_card_list"
          )) {
            if (-not $cardsPromptStyleText.Contains($marker)) { throw "Card list scroll clearance style missing: $marker" }
          }
          if (-not (Get-Content -Raw -LiteralPath $targetIndex).Contains('id="b_collection_filter_btn"')) { throw "Build Collection filter button missing." }
          if (-not (Get-Content -Raw -LiteralPath $targetState).Contains("buildIncludeCollections: false")) { throw "Build Collection filter default missing." }
          if (-not (Get-Content -Raw -LiteralPath $targetBuildMain).Contains("library_state.buildIncludeCollections && post?.items?.length")) { throw "Build Collection item filter missing." }
          if (-not (Get-Content -Raw -LiteralPath $targetBSource).Contains('const collectionMode = library_state.buildIncludeCollections ? "with-collection" : "without-collection";')) { throw "Build Collection paging key missing." }
          if (-not (Get-Content -Raw -LiteralPath $targetSidebarEvents).Contains('document.getElementById("b_collection_filter_btn")?.addEventListener')) { throw "Build Collection filter event missing." }
          if (-not (Get-Content -Raw -LiteralPath $targetMainStyle).Contains("gap: 70px;")) { throw "Build Collection text spacing missing." }
          if (-not (Get-Content -Raw -LiteralPath $targetAttachments).Contains("conversation_id: conversationId")) { throw "Attachment conversation lineage marker missing." }
          if (-not (Get-Content -Raw -LiteralPath $targetISubmit).Contains("source_conversation_id: sourceContext.conversation_id")) { throw "Submit conversation lineage marker missing." }
          if (-not (Get-Content -Raw -LiteralPath $targetBSubmit).Contains('const completedMode = String(job.context?.mode || "").toLowerCase();')) { throw "Build attachment reset marker missing." }
          if (-not (Get-Content -Raw -LiteralPath $targetISubmit).Contains('new Set(["i2i", "i2v"])')) { throw "Imagine attachment reset marker missing." }
          if (-not (Get-Content -Raw -LiteralPath $targetLibraryCore).Contains('if (type === "image" || type.startsWith("image/"))')) { throw "Sharp image preview marker missing." }
          $libraryScanText = Get-Content -Raw -LiteralPath $targetLibraryScan
          foreach ($marker in @(
            'async function loadIndexedBuildPosts(',
            'async function loadIndexedCollectionPostContents(',
            'async function loadIndexedSearchBuildPosts(',
            'async function loadIndexedPost(path)'
          )) {
            if (-not $libraryScanText.Contains($marker)) { throw "Indexed card loader marker missing: $marker" }
          }
          if (-not (Get-Content -Raw -LiteralPath $targetCollectionRender).Contains('const COLLECTION_SECOND_MAIN_VIRTUAL_LIST_KEY = "collection-second-main";')) { throw "Collection virtual list marker missing." }
          if (-not (Get-Content -Raw -LiteralPath $targetDetailNavigation).Contains("async function navigateDetailPost(offset)")) { throw "Indexed detail navigation marker missing." }
          if (-not (Get-Content -Raw -LiteralPath $targetSearchRender).Contains("library_state.indexedSearchBuildHasMore")) { throw "Indexed search paging marker missing." }
          if (-not (Get-Content -Raw -LiteralPath $targetDetailState).Contains("function detailItemPrompt(item)")) { throw "Detail prompt lineage marker missing." }
          $detailMediaText = Get-Content -Raw -LiteralPath $targetDetailMedia
          if (-not $detailMediaText.Contains('resolveLocalCardPreview(url, kind = "card", cacheIdentity = "")')) { throw "Persistent Build preview kind marker missing." }
          if (-not $detailMediaText.Contains('async function existingPersistentCardPreview(rawUrl, kind = "card", cacheIdentity = "")')) { throw "Persistent Build preview reuse marker missing." }
          $detailRenderText = Get-Content -Raw -LiteralPath $targetDetailRender
          if (-not $detailRenderText.Contains('function syncBuildDetailHeartState(post) {')) { throw "Build detail heart marker missing." }
          if (-not $detailRenderText.Contains('resolveLocalCardPreview(buildPreviewSource, "thumbnail")')) { throw "Build detail thumbnail preview marker missing." }
          if (-not $detailRenderText.Contains('button.hidden = true;')) { throw "Build detail heart is no longer hidden." }
          if (-not (Get-Content -Raw -LiteralPath $targetISource).Contains("function isImagineT2iGroupContainer(post)")) { throw "T2I group filter marker missing." }
          if (-not (Get-Content -Raw -LiteralPath $targetISource).Contains('screen_state.current_screen === "i_unsaved_main"')) { throw "Unsaved pagination refill marker missing." }
          $collectionActionsText = Get-Content -Raw -LiteralPath $targetCollectionActions
          foreach ($marker in @(
            'let moveToCollectionRequestPending = false;',
            'if (moveToCollectionRequestPending) return;',
            'moveToCollectionRequestPending = true;',
            'moveToCollectionRequestPending = false;'
          )) {
            if (-not $collectionActionsText.Contains($marker)) { throw "Collection move guard marker missing: $marker" }
          }
          $promptEventsText = Get-Content -Raw -LiteralPath $targetPromptEvents
          $promptWritePattern = '(?s)document\.querySelector\("\.prompt_write_btn"\)\?\.addEventListener\("click", \(\) => \{\s*openPromptSave\(\);\s*\}\);'
          if ($promptEventsText -notmatch $promptWritePattern) { throw "Prompt Write does not open the shared prompt save dialog." }
          if (-not (Get-Content -Raw -LiteralPath $targetUiFeedback).Contains('".workspace.i_detail_open .i_detail_media, .workspace.b_detail_open .b_detail_media"')) { throw "Lucky media center marker missing." }
          if (-not (Get-Content -Raw -LiteralPath $targetAccountStyle).Contains(".lucky_notice.in_detail_media")) { throw "Lucky media position marker missing." }
          if (-not (Get-Content -Raw -LiteralPath $targetDetailMedia).Contains("function scheduleLocalCardVideoPoster(")) { throw "Build video poster scheduling marker missing." }
          if (-not (Get-Content -Raw -LiteralPath $targetCardRender).Contains('card_static_video_preview: type === "video" && Boolean(previewUrl)')) { throw "Static Imagine video poster marker missing." }
          if (-not $mainText.Contains("const CARD_PREVIEW_MAX_EDGE = 960;")) { throw "Card preview size dropped below the 512x288 requirement." }
          if ((Test-Path -LiteralPath (Join-Path $root "Resources\Migration")) -or (Test-Path -LiteralPath (Join-Path $root "Migration.exe"))) {
            throw "Migration app remains in the Windows package."
          }
          foreach ($portableResidue in @(".library_path.json", "library_path.json", "runtime_data", "sql_data")) {
            if (Test-Path -LiteralPath (Join-Path $root $portableResidue)) {
              throw "Portable runtime residue remains in the Windows package: $portableResidue"
            }
          }

          $fileCount = (Get-ChildItem -LiteralPath $root -Recurse -Force -File).Count
          $metadata = Get-ChildItem -LiteralPath $root -Recurse -Force | Where-Object {
            $_.Name -eq "__MACOSX" -or $_.Name -like "._*" -or $_.Name -eq ".DS_Store"
          }
          if ($metadata) { throw "macOS metadata exists in the Windows package." }

          Push-Location (Join-Path $env:GITHUB_WORKSPACE "unpack")
          try {
            & $sevenZip a -tzip -mx=7 $outputZip ".\Grok Chameleon"
            if ($LASTEXITCODE -ne 0) { throw "Windows ZIP creation failed." }
          } finally {
            Pop-Location
          }
          & $sevenZip t $outputZip
          if ($LASTEXITCODE -ne 0) { throw "Windows output ZIP CRC check failed." }
          & $sevenZip x -y "-o$env:GITHUB_WORKSPACE\verify" $outputZip
          if ($LASTEXITCODE -ne 0) { throw "Windows verification extraction failed." }

          $verifiedRoot = Join-Path $env:GITHUB_WORKSPACE "verify\Grok Chameleon"
          $verifiedAppRoot = Join-Path $verifiedRoot "Resources\Grok Chameleon\resources\app"
          if ((Get-ChildItem -LiteralPath $verifiedRoot -Recurse -Force -File).Count -ne $fileCount) {
            throw "Windows file count changed during packaging."
          }
          foreach ($shared in $sharedSources) {
            $verifiedPath = Join-Path $verifiedAppRoot $shared.Relative
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $verifiedPath).Hash -ne $sharedHashes[$shared.Name]) {
              throw "Windows packaged shared source mismatch: $($shared.Name)"
            }
          }
          $verifiedExeHashes = @{
            outer = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $verifiedRoot "Grok Chameleon.exe")).Hash
            inner = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $verifiedRoot "Resources\Grok Chameleon\Grok Chameleon.exe")).Hash
          }
          foreach ($key in @("outer", "inner")) {
            if ($verifiedExeHashes[$key] -ne $exeHashes[$key]) { throw "Windows executable changed: $key" }
          }
          foreach ($javascript in $sharedSources | Where-Object { $_.Relative.EndsWith(".js") }) {
            node --check (Join-Path $verifiedAppRoot $javascript.Relative)
            if ($LASTEXITCODE -ne 0) { throw "Packaged Windows JavaScript syntax check failed: $($javascript.Relative)" }
          }
          python -c "import ast,pathlib,sys; ast.parse(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'), filename=sys.argv[1])" (Join-Path $verifiedAppRoot "runtime\server.py")
          if ($LASTEXITCODE -ne 0) { throw "Packaged Windows server syntax check failed." }
          python -c "import ast,pathlib,sys; ast.parse(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'), filename=sys.argv[1])" (Join-Path $verifiedAppRoot "runtime\library_index.py")
          if ($LASTEXITCODE -ne 0) { throw "Packaged Windows library index syntax check failed." }
          python -c "import ast,pathlib,sys; ast.parse(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'), filename=sys.argv[1])" (Join-Path $verifiedAppRoot "runtime\imagine_state.py")
          if ($LASTEXITCODE -ne 0) { throw "Packaged Windows imagine_state syntax check failed." }
          python -c "import ast,pathlib,sys; ast.parse(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'), filename=sys.argv[1])" (Join-Path $verifiedAppRoot "runtime\imagine_accounts.py")
          if ($LASTEXITCODE -ne 0) { throw "Packaged Windows imagine_accounts syntax check failed." }
          python -c "import ast,pathlib,sys; ast.parse(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'), filename=sys.argv[1])" (Join-Path $verifiedAppRoot "runtime\imagine_routes.py")
          if ($LASTEXITCODE -ne 0) { throw "Packaged Windows imagine_routes syntax check failed." }
          "windows-output-sha256=" + (Get-FileHash -Algorithm SHA256 -LiteralPath $outputZip).Hash.ToLowerInvariant()

      - name: Retain the verified Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: output/${{ matrix.output_zip }}
          if-no-files-found: error
          retention-days: 3

  build-macos:
    runs-on: macos-15
    timeout-minutes: 35
    outputs:
      input_sha256: ${{ steps.macos_input.outputs.sha256 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            common_dir: common
            output_zip: Mac_Grok_Chameleon.zip
            artifact: mac-build
    env:
      RELEASE_TAG: Grok_Chameleon
      INPUT_ZIP: Mac_Grok_Chameleon.zip
      OUTPUT_ZIP: ${{ matrix.output_zip }}
      VARIANT_COMMON_DIR: ${{ matrix.common_dir }}

    steps:
      - name: Check out the shared source commit
        uses: actions/checkout@v4

      - name: Download the exact Mac runtime package
        id: macos_input
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p input
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$INPUT_ZIP" --dir input
          actual="$(shasum -a 256 "input/$INPUT_ZIP" | awk '{print $1}')"
          echo "sha256=$actual" >> "$GITHUB_OUTPUT"

      - name: Assemble Mac from the shared source
        shell: bash
        run: |
          set -euo pipefail
          export COPYFILE_DISABLE=1
          mkdir -p unpack output verify
          ditto -x -k "input/$INPUT_ZIP" unpack
          assembled_root="$PWD/unpack/Grok Chameleon"
          clean_parent="$RUNNER_TEMP/grok-chameleon-final-stage"
          test ! -e "$clean_parent"
          mkdir -p "$clean_parent"
          ditto --norsrc --noextattr --noacl --noqtn "$assembled_root" "$clean_parent/Grok Chameleon"
          root="$clean_parent/Grok Chameleon"
          main_app="$root/Grok Chameleon.app"
          migration_app="$root/Migration.app"
          app_root="$main_app/Contents/Resources/app"
          common_root="$GITHUB_WORKSPACE/$VARIANT_COMMON_DIR/app"
          shared_relatives=(
            electron/main.js
            electron/preload-bridge.js
            runtime/server.py
            runtime/library_index.py
            runtime/imagine_state.py
            runtime/imagine_accounts.py
            runtime/imagine_routes.py
            web/index.html
            web/styles/app.css
            web/scripts/state.js
            web/scripts/build_main.js
            web/scripts/b_composer_submit.js
            web/scripts/b_source_render.js
            web/scripts/b_detail_actions.js
            web/scripts/sidebar_events.js
            web/styles/sidebar.css
            web/scripts/collection_events.js
            web/scripts/collection_render.js
            web/styles/collection.css
            web/styles/main.css
            web/scripts/card_render.js
            web/scripts/detail_common_actions.js
            web/scripts/card_actions.js
            web/scripts/screen_events.js
            web/scripts/screen_router.js
            web/scripts/navigation_history.js
            web/scripts/i_detail_actions.js
            web/scripts/composer_events.js
            web/scripts/composer_provider.js
            web/styles/cards_prompt.css
            web/scripts/composer_options.js
            web/scripts/composer_attachments.js
            web/scripts/i_composer_submit.js
            web/scripts/library_core.js
            web/scripts/prompt_translate.js
            web/scripts/library_scan.js
            web/scripts/detail_state.js
            web/scripts/detail_media.js
            web/scripts/detail_video_player.js
            web/scripts/detail_events.js
            web/scripts/detail_navigation.js
            web/scripts/detail_render.js
            web/styles/detail.css
            web/scripts/i_source_render.js
            web/scripts/imagine_main.js
            web/scripts/render.js
            web/scripts/collection_actions.js
            web/scripts/image_editor_flow.js
            web/scripts/search_render.js
            web/scripts/prompt_events.js
            web/scripts/prompt_account.js
            web/scripts/account_core.js
            web/scripts/ui_feedback.js
            web/styles/account.css
            web/styles/composer.css
            vendor/ffmpeg/ffmpeg
            vendor/ffmpeg/COPYING.LGPLv2.1
          )
          target="$app_root/web/scripts/composer_options.js"
          main_js="$app_root/electron/main.js"
          preload_js="$app_root/electron/preload-bridge.js"
          server_py="$app_root/runtime/server.py"
          library_index_py="$app_root/runtime/library_index.py"
          imagine_state_py="$app_root/runtime/imagine_state.py"
          imagine_accounts_py="$app_root/runtime/imagine_accounts.py"
          imagine_routes_py="$app_root/runtime/imagine_routes.py"
          prompt_account_js="$app_root/web/scripts/prompt_account.js"
          account_core_js="$app_root/web/scripts/account_core.js"
          index_html="$app_root/web/index.html"
          state_js="$app_root/web/scripts/state.js"
          build_main_js="$app_root/web/scripts/build_main.js"
          b_submit_js="$app_root/web/scripts/b_composer_submit.js"
          b_source_js="$app_root/web/scripts/b_source_render.js"
          sidebar_events_js="$app_root/web/scripts/sidebar_events.js"
          main_css="$app_root/web/styles/main.css"
          card_render_js="$app_root/web/scripts/card_render.js"
          i_detail_actions_js="$app_root/web/scripts/i_detail_actions.js"
          composer_events_js="$app_root/web/scripts/composer_events.js"
          cards_prompt_css="$app_root/web/styles/cards_prompt.css"
          attachments_js="$app_root/web/scripts/composer_attachments.js"
          i_submit_js="$app_root/web/scripts/i_composer_submit.js"
          library_core_js="$app_root/web/scripts/library_core.js"
          library_scan_js="$app_root/web/scripts/library_scan.js"
          collection_render_js="$app_root/web/scripts/collection_render.js"
          detail_state_js="$app_root/web/scripts/detail_state.js"
          detail_media_js="$app_root/web/scripts/detail_media.js"
          detail_navigation_js="$app_root/web/scripts/detail_navigation.js"
          detail_render_js="$app_root/web/scripts/detail_render.js"
          i_source_js="$app_root/web/scripts/i_source_render.js"
          collection_actions_js="$app_root/web/scripts/collection_actions.js"
          search_render_js="$app_root/web/scripts/search_render.js"
          prompt_events_js="$app_root/web/scripts/prompt_events.js"
          ui_feedback_js="$app_root/web/scripts/ui_feedback.js"
          account_css="$app_root/web/styles/account.css"
          main_exec="$main_app/Contents/MacOS/Grok Chameleon"

          for relative in "${shared_relatives[@]}"; do
            test -f "$common_root/$relative"
          done
          test -x "$main_exec"
          test -L "$main_app/Contents/Frameworks/Electron Framework.framework/Versions/Current"
          test -L "$main_app/Contents/Frameworks/Electron Framework.framework/Electron Framework"
          find "$app_root/vendor/python" -type f -name '*darwin.so' -print -quit | grep -q .
          if find "$root" \( -name '__MACOSX' -o -name '._*' -o -name '.DS_Store' \) -print | grep -q .; then
            echo 'AppleDouble or Finder metadata found in Mac input.' >&2
            exit 1
          fi

          for relative in "${shared_relatives[@]}"; do
            mkdir -p "$(dirname "$app_root/$relative")"
            cp "$common_root/$relative" "$app_root/$relative"
            cmp "$common_root/$relative" "$app_root/$relative"
            if [[ "$relative" == *.js ]]; then
              node --check "$app_root/$relative"
            fi
          done
          # git stores the bundled ffmpeg without the executable bit.
          chmod +x "$app_root/vendor/ffmpeg/ffmpeg"
          test -x "$app_root/vendor/ffmpeg/ffmpeg"
          python3 - "$server_py" <<'PY'
          import ast
          import pathlib
          import sys
          path = pathlib.Path(sys.argv[1])
          ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          PY
          python3 - "$library_index_py" <<'PY'
          import ast
