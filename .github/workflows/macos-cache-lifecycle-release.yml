name: Cross-platform common source release

on:
  push:
    branches:
      - agent/macos-cache-lifecycle-20260721

permissions:
  contents: write

concurrency:
  group: cross-platform-common-source-release
  cancel-in-progress: false

env:
  COMMON_COMPOSER: common/app/web/scripts/composer_options.js

jobs:
  build-windows:
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      RELEASE_TAG: v20260720-041036-win
      INPUT_ZIP: Win_Grok_Chameleon_a.zip
      OUTPUT_ZIP: Win_Grok_Chameleon_a.zip
      EXPECTED_INPUT_SHA256: d55301c90d6bf07d3d709ea8fe63a778e0b7da2fd1cf992f32e570f7a597cc36

    steps:
      - name: Check out the shared source commit
        uses: actions/checkout@v4

      - name: Download the exact Windows runtime package
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force input | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern $env:INPUT_ZIP --dir input
          if ($LASTEXITCODE -ne 0) { throw "Windows release download failed." }

      - name: Assemble and verify Windows from the shared source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
          New-Item -ItemType Directory -Force unpack, output, verify | Out-Null
          $inputZip = Join-Path $env:GITHUB_WORKSPACE "input\$env:INPUT_ZIP"
          $outputZip = Join-Path $env:GITHUB_WORKSPACE "output\$env:OUTPUT_ZIP"
          $common = Join-Path $env:GITHUB_WORKSPACE $env:COMMON_COMPOSER
          $root = Join-Path $env:GITHUB_WORKSPACE "unpack\Grok Chameleon"
          $appRoot = Join-Path $root "Resources\Grok Chameleon\resources\app"
          $target = Join-Path $appRoot "web\scripts\composer_options.js"
          $state = Join-Path $appRoot "web\scripts\state.js"
          $outerExe = Join-Path $root "Grok Chameleon.exe"
          $migrationExe = Join-Path $root "Migration.exe"
          $innerExe = Join-Path $root "Resources\Grok Chameleon\Grok Chameleon.exe"

          $inputHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $inputZip).Hash.ToLowerInvariant()
          if ($inputHash -ne $env:EXPECTED_INPUT_SHA256) { throw "Windows input digest changed: $inputHash" }
          & $sevenZip t $inputZip
          if ($LASTEXITCODE -ne 0) { throw "Windows input ZIP CRC check failed." }
          & $sevenZip x -y "-o$env:GITHUB_WORKSPACE\unpack" $inputZip
          if ($LASTEXITCODE -ne 0) { throw "Windows extraction failed." }
          foreach ($required in @($common, $target, $state, $outerExe, $migrationExe, $innerExe)) {
            if (-not (Test-Path -LiteralPath $required)) { throw "Missing required file: $required" }
          }

          $fileCount = (Get-ChildItem -LiteralPath $root -Recurse -Force -File).Count
          $exeHashes = @{
            outer = (Get-FileHash -Algorithm SHA256 -LiteralPath $outerExe).Hash
            migration = (Get-FileHash -Algorithm SHA256 -LiteralPath $migrationExe).Hash
            inner = (Get-FileHash -Algorithm SHA256 -LiteralPath $innerExe).Hash
          }
          Copy-Item -Force -LiteralPath $common -Destination $target
          $commonHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $common).Hash
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $target).Hash -ne $commonHash) {
            throw "Windows shared source copy mismatch."
          }
          node --check $target
          if ($LASTEXITCODE -ne 0) { throw "Windows composer_options.js syntax check failed." }

          $composerText = Get-Content -Raw -LiteralPath $target
          foreach ($marker in @(
            'const imageCountOptions = provider === "imagine"',
            '? buildT2iCountOptions.filter((option) => option !== "1")',
            'const imageCountDefault = "5";',
            'setControlVisible(composerControls.count, !isImageToImage'
          )) {
            if (-not $composerText.Contains($marker)) { throw "Windows composer marker missing: $marker" }
          }
          $stateText = Get-Content -Raw -LiteralPath $state
          if (-not $stateText.Contains('const buildT2iCountOptions = ["10", "8", "5", "4", "1"];')) {
            throw "Build count options changed unexpectedly."
          }
          $metadata = Get-ChildItem -LiteralPath $root -Recurse -Force | Where-Object {
            $_.Name -eq "__MACOSX" -or $_.Name -like "._*" -or $_.Name -eq ".DS_Store"
          }
          if ($metadata) { throw "macOS metadata exists in the Windows package." }

          Push-Location (Join-Path $env:GITHUB_WORKSPACE "unpack")
          try {
            & $sevenZip a -tzip -mx=7 $outputZip ".\Grok Chameleon"
            if ($LASTEXITCODE -ne 0) { throw "Windows ZIP creation failed." }
          } finally {
            Pop-Location
          }
          & $sevenZip t $outputZip
          if ($LASTEXITCODE -ne 0) { throw "Windows output ZIP CRC check failed." }
          & $sevenZip x -y "-o$env:GITHUB_WORKSPACE\verify" $outputZip
          if ($LASTEXITCODE -ne 0) { throw "Windows verification extraction failed." }

          $verifiedRoot = Join-Path $env:GITHUB_WORKSPACE "verify\Grok Chameleon"
          $verifiedTarget = Join-Path $verifiedRoot "Resources\Grok Chameleon\resources\app\web\scripts\composer_options.js"
          if ((Get-ChildItem -LiteralPath $verifiedRoot -Recurse -Force -File).Count -ne $fileCount) {
            throw "Windows file count changed during packaging."
          }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $verifiedTarget).Hash -ne $commonHash) {
            throw "Windows packaged shared source mismatch."
          }
          $verifiedExeHashes = @{
            outer = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $verifiedRoot "Grok Chameleon.exe")).Hash
            migration = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $verifiedRoot "Migration.exe")).Hash
            inner = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $verifiedRoot "Resources\Grok Chameleon\Grok Chameleon.exe")).Hash
          }
          foreach ($key in @("outer", "migration", "inner")) {
            if ($verifiedExeHashes[$key] -ne $exeHashes[$key]) { throw "Windows executable changed: $key" }
          }
          node --check $verifiedTarget
          if ($LASTEXITCODE -ne 0) { throw "Packaged Windows JavaScript syntax check failed." }
          "windows-output-sha256=" + (Get-FileHash -Algorithm SHA256 -LiteralPath $outputZip).Hash.ToLowerInvariant()

      - name: Retain the verified Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows-common-source-build
          path: output/Win_Grok_Chameleon_a.zip
          if-no-files-found: error
          retention-days: 3

  build-macos:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      RELEASE_TAG: v20260720-042100-mac
      INPUT_ZIP: Mac_Grok_Chameleon_a.zip
      OUTPUT_ZIP: Mac_Grok_Chameleon_a.zip
      EXPECTED_INPUT_SHA256: 401d0947f092cded02d2d6a2bdbdd76b3a8254fdfdcd15ee870e8d72e6c83d59

    steps:
      - name: Check out the shared source commit
        uses: actions/checkout@v4

      - name: Download the exact Mac runtime package
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p input
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$INPUT_ZIP" --dir input
          actual="$(shasum -a 256 "input/$INPUT_ZIP" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_INPUT_SHA256"

      - name: Assemble Mac from the shared source
        shell: bash
        run: |
          set -euo pipefail
          export COPYFILE_DISABLE=1
          mkdir -p unpack output verify
          ditto -x -k "input/$INPUT_ZIP" unpack
          root="$PWD/unpack/Grok Chameleon"
          main_app="$root/Grok Chameleon.app"
          migration_app="$root/Migration.app"
          app_root="$main_app/Contents/Resources/app"
          common="$GITHUB_WORKSPACE/$COMMON_COMPOSER"
          target="$app_root/web/scripts/composer_options.js"
          main_js="$app_root/electron/main.js"
          preload_js="$app_root/electron/preload-bridge.js"
          server_py="$app_root/runtime/server.py"
          main_exec="$main_app/Contents/MacOS/Grok Chameleon"
          migration_exec="$migration_app/Contents/MacOS/Migration"

          test -f "$common"
          test -f "$target"
          test -f "$main_js"
          test -f "$preload_js"
          test -f "$server_py"
          test -x "$main_exec"
          test -x "$migration_exec"
          test -L "$main_app/Contents/Frameworks/Electron Framework.framework/Versions/Current"
          test -L "$main_app/Contents/Frameworks/Electron Framework.framework/Electron Framework"
          find "$app_root/vendor/python" -type f -name '*darwin.so' -print -quit | grep -q .
          if find "$root" \( -name '__MACOSX' -o -name '._*' -o -name '.DS_Store' \) -print | grep -q .; then
            echo 'AppleDouble or Finder metadata found in Mac input.' >&2
            exit 1
          fi

          cp "$common" "$target"
          cmp "$common" "$target"
          node --check "$target"
          grep -F 'const imageCountOptions = provider === "imagine"' "$target"
          grep -F '? buildT2iCountOptions.filter((option) => option !== "1")' "$target"
          grep -F 'const imageCountDefault = "5";' "$target"
          grep -F 'RUNTIME_ROOT = Path(__file__).resolve().parent' "$server_py"
          grep -F 'APP_ROOT = RUNTIME_ROOT.parent' "$server_py"
          if grep -E 'C:\\|python\.exe' "$server_py"; then
            echo 'Windows-only path leaked into Mac server.py.' >&2
            exit 1
          fi
          grep -F 'process.platform === "darwin"' "$main_js"
          grep -F 'process.resourcesPath' "$main_js"
          grep -F 'path.join(resourceRoot, "Python", "bin", "python3")' "$main_js"
          grep -F 'app.on("activate"' "$main_js"
          grep -F 'app.on("window-all-closed"' "$main_js"

      - name: Sign, package, and verify Mac without ZIP -47 regressions
        shell: bash
        run: |
          set -euo pipefail
          export COPYFILE_DISABLE=1
          root="$PWD/unpack/Grok Chameleon"
          main_app="$root/Grok Chameleon.app"
          migration_app="$root/Migration.app"
          app_root="$main_app/Contents/Resources/app"
          common="$GITHUB_WORKSPACE/$COMMON_COMPOSER"
          if find "$root" -type d -name '__pycache__' -print | grep -q .; then
            echo 'Python cache found before Mac packaging.' >&2
            exit 1
          fi
          xattr -cr "$root"
          if xattr -lr "$root" 2>/dev/null | grep -q 'com.apple.quarantine'; then
            echo 'Quarantine attribute remains before Mac signing.' >&2
            exit 1
          fi
          codesign --force --sign - --timestamp=none "$migration_app"
          codesign --force --sign - --timestamp=none "$main_app"
          codesign --verify --deep --strict --verbose=4 "$migration_app"
          codesign --verify --deep --strict --verbose=4 "$main_app"
          plutil -lint "$migration_app/Contents/Info.plist"
          plutil -lint "$main_app/Contents/Info.plist"
          xattr -cr "$root"
          ditto -c -k --keepParent --norsrc --noextattr --noacl --noqtn "$root" "output/$OUTPUT_ZIP"
          unzip -t "output/$OUTPUT_ZIP"
          if zipinfo -1 "output/$OUTPUT_ZIP" | grep -E '(^|/)(__MACOSX|\._|\.DS_Store)(/|$)'; then
            echo 'AppleDouble or Finder metadata found in Mac output.' >&2
            exit 1
          fi

          ditto -x -k "output/$OUTPUT_ZIP" verify
          verified_root="$PWD/verify/Grok Chameleon"
          verified_main="$verified_root/Grok Chameleon.app"
          verified_migration="$verified_root/Migration.app"
          verified_app="$verified_main/Contents/Resources/app"
          verified_target="$verified_app/web/scripts/composer_options.js"
          test -x "$verified_main/Contents/MacOS/Grok Chameleon"
          test -x "$verified_migration/Contents/MacOS/Migration"
          test -L "$verified_main/Contents/Frameworks/Electron Framework.framework/Versions/Current"
          test -L "$verified_main/Contents/Frameworks/Electron Framework.framework/Electron Framework"
          codesign --verify --deep --strict --verbose=4 "$verified_main"
          codesign --verify --deep --strict --verbose=4 "$verified_migration"
          cmp "$common" "$verified_target"
          node --check "$verified_target"
          if find "$verified_root" \( -name '__MACOSX' -o -name '._*' -o -name '.DS_Store' -o -name '__pycache__' \) -print | grep -q .; then
            echo 'Forbidden metadata found after final Mac extraction.' >&2
            exit 1
          fi
          if xattr -lr "$verified_root" 2>/dev/null | grep -q 'com.apple.quarantine'; then
            echo 'Quarantine attribute found after final Mac extraction.' >&2
            exit 1
          fi
          ELECTRON_RUN_AS_NODE=1 "$verified_main/Contents/MacOS/Grok Chameleon" -e 'console.log("MAC_ELECTRON_OK")'
          shasum -a 256 "output/$OUTPUT_ZIP"

      - name: Retain the verified Mac build
        uses: actions/upload-artifact@v4
        with:
          name: mac-common-source-build
          path: output/Mac_Grok_Chameleon_a.zip
          if-no-files-found: error
          retention-days: 3

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - build-windows
      - build-macos
    steps:
      - name: Download the verified Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-common-source-build
          path: release/windows

      - name: Download the verified Mac build
        uses: actions/download-artifact@v4
        with:
          name: mac-common-source-build
          path: release/macos

      - name: Preserve and replace both release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_TAG: v20260720-041036-win
          MAC_TAG: v20260720-042100-mac
          WIN_ZIP: Win_Grok_Chameleon_a.zip
          MAC_ZIP: Mac_Grok_Chameleon_a.zip
          WIN_INPUT_SHA256: d55301c90d6bf07d3d709ea8fe63a778e0b7da2fd1cf992f32e570f7a597cc36
          MAC_INPUT_SHA256: 401d0947f092cded02d2d6a2bdbdd76b3a8254fdfdcd15ee870e8d72e6c83d59
        run: |
          set -euo pipefail
          mkdir -p current/win current/mac backups
          gh release download "$WIN_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$WIN_ZIP" --dir current/win
          gh release download "$MAC_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$MAC_ZIP" --dir current/mac
          test "$(sha256sum "current/win/$WIN_ZIP" | awk '{print $1}')" = "$WIN_INPUT_SHA256"
          test "$(sha256sum "current/mac/$MAC_ZIP" | awk '{print $1}')" = "$MAC_INPUT_SHA256"
          short_sha="$(printf '%s' "$GITHUB_SHA" | cut -c1-12)"
          win_backup="Win_Grok_Chameleon_a.previous-before-t2i-count-no-1-$short_sha.zip"
          mac_backup="Mac_Grok_Chameleon_a.previous-before-t2i-count-no-1-$short_sha.zip"
          cp "current/win/$WIN_ZIP" "backups/$win_backup"
          cp "current/mac/$MAC_ZIP" "backups/$mac_backup"
          gh release upload "$WIN_TAG" "backups/$win_backup" --repo "$GITHUB_REPOSITORY"
          gh release upload "$MAC_TAG" "backups/$mac_backup" --repo "$GITHUB_REPOSITORY"

          rollback() {
            echo 'Rolling back both production assets.' >&2
            gh release upload "$WIN_TAG" "current/win/$WIN_ZIP" --repo "$GITHUB_REPOSITORY" --clobber || true
            gh release upload "$MAC_TAG" "current/mac/$MAC_ZIP" --repo "$GITHUB_REPOSITORY" --clobber || true
          }
          trap rollback ERR
          gh release upload "$WIN_TAG" "release/windows/$WIN_ZIP" --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$MAC_TAG" "release/macos/$MAC_ZIP" --repo "$GITHUB_REPOSITORY" --clobber
          win_local="sha256:$(sha256sum "release/windows/$WIN_ZIP" | awk '{print $1}')"
          mac_local="sha256:$(sha256sum "release/macos/$MAC_ZIP" | awk '{print $1}')"
          win_remote="$(gh release view "$WIN_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name == "'"$WIN_ZIP"'") | .digest')"
          mac_remote="$(gh release view "$MAC_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name == "'"$MAC_ZIP"'") | .digest')"
          test "$win_local" = "$win_remote"
          test "$mac_local" = "$mac_remote"
          trap - ERR
          echo "windows-production-digest=$win_remote"
          echo "mac-production-digest=$mac_remote"
