name: Cross-platform common source release

on:
  push:
    branches:
      - agent/macos-cache-lifecycle-20260721

permissions:
  contents: write

concurrency:
  group: cross-platform-common-source-release
  cancel-in-progress: false

env:
  COMMON_MAIN: common/app/electron/main.js
  COMMON_COMPOSER: common/app/web/scripts/composer_options.js
  COMMON_ATTACHMENTS: common/app/web/scripts/composer_attachments.js
  COMMON_I_SUBMIT: common/app/web/scripts/i_composer_submit.js
  COMMON_LIBRARY_CORE: common/app/web/scripts/library_core.js
  COMMON_DETAIL_STATE: common/app/web/scripts/detail_state.js
  COMMON_DETAIL_RENDER: common/app/web/scripts/detail_render.js
  COMMON_I_SOURCE: common/app/web/scripts/i_source_render.js
  COMMON_UI_FEEDBACK: common/app/web/scripts/ui_feedback.js
  COMMON_ACCOUNT_STYLE: common/app/web/styles/account.css
  COMMON_PRELOAD: common/app/electron/preload-bridge.js
  COMMON_SERVER: common/app/runtime/server.py
  COMMON_MIGRATION: common/migration/migration.py
  WINDOWS_MIGRATION_UI: platform/windows/migration/migration_windows.ps1
  MACOS_MIGRATION_UI: platform/macos/migration/Migration.swift

jobs:
  build-windows:
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      RELEASE_TAG: v20260720-041036-win
      INPUT_ZIP: Win_Grok_Chameleon_a.zip
      OUTPUT_ZIP: Win_Grok_Chameleon_a.zip
      EXPECTED_INPUT_SHA256: f4799a687810490cb6b5d009cf3e43902231952fe9d4bbf6ebb5cf8df0c7d465

    steps:
      - name: Check out the shared source commit
        uses: actions/checkout@v4

      - name: Download the exact Windows runtime package
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force input | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern $env:INPUT_ZIP --dir input
          if ($LASTEXITCODE -ne 0) { throw "Windows release download failed." }

      - name: Assemble and verify Windows from the shared source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
          New-Item -ItemType Directory -Force unpack, output, verify | Out-Null
          $inputZip = Join-Path $env:GITHUB_WORKSPACE "input\$env:INPUT_ZIP"
          $outputZip = Join-Path $env:GITHUB_WORKSPACE "output\$env:OUTPUT_ZIP"
          $root = Join-Path $env:GITHUB_WORKSPACE "unpack\Grok Chameleon"
          $appRoot = Join-Path $root "Resources\Grok Chameleon\resources\app"
          $migrationRoot = Join-Path $root "Resources\Migration"
          $state = Join-Path $appRoot "web\scripts\state.js"
          $outerExe = Join-Path $root "Grok Chameleon.exe"
          $migrationExe = Join-Path $root "Migration.exe"
          $innerExe = Join-Path $root "Resources\Grok Chameleon\Grok Chameleon.exe"
          $sourceMigration = Join-Path $env:GITHUB_WORKSPACE $env:COMMON_MIGRATION
          $sourceMigrationUi = Join-Path $env:GITHUB_WORKSPACE $env:WINDOWS_MIGRATION_UI
          $targetMigration = Join-Path $migrationRoot "migration.py"
          $targetMigrationUi = Join-Path $migrationRoot "migration_windows.ps1"
          $sharedSources = @(
            @{ Name = "main"; Relative = "electron\main.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_MAIN) },
            @{ Name = "preload"; Relative = "electron\preload-bridge.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_PRELOAD) },
            @{ Name = "server"; Relative = "runtime\server.py"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_SERVER) },
            @{ Name = "composer"; Relative = "web\scripts\composer_options.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_COMPOSER) },
            @{ Name = "attachments"; Relative = "web\scripts\composer_attachments.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_ATTACHMENTS) },
            @{ Name = "i_submit"; Relative = "web\scripts\i_composer_submit.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_I_SUBMIT) },
            @{ Name = "library_core"; Relative = "web\scripts\library_core.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_LIBRARY_CORE) },
            @{ Name = "detail_state"; Relative = "web\scripts\detail_state.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_DETAIL_STATE) },
            @{ Name = "detail_render"; Relative = "web\scripts\detail_render.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_DETAIL_RENDER) },
            @{ Name = "i_source"; Relative = "web\scripts\i_source_render.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_I_SOURCE) },
            @{ Name = "ui_feedback"; Relative = "web\scripts\ui_feedback.js"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_UI_FEEDBACK) },
            @{ Name = "account_style"; Relative = "web\styles\account.css"; Source = (Join-Path $env:GITHUB_WORKSPACE $env:COMMON_ACCOUNT_STYLE) }
          )
          foreach ($shared in $sharedSources) {
            $shared.Target = Join-Path $appRoot $shared.Relative
          }
          $targetMain = ($sharedSources | Where-Object Name -eq "main").Target
          $targetPreload = ($sharedSources | Where-Object Name -eq "preload").Target
          $targetServer = ($sharedSources | Where-Object Name -eq "server").Target
          $targetComposer = ($sharedSources | Where-Object Name -eq "composer").Target
          $targetAttachments = ($sharedSources | Where-Object Name -eq "attachments").Target
          $targetISubmit = ($sharedSources | Where-Object Name -eq "i_submit").Target
          $targetLibraryCore = ($sharedSources | Where-Object Name -eq "library_core").Target
          $targetDetailState = ($sharedSources | Where-Object Name -eq "detail_state").Target
          $targetDetailRender = ($sharedSources | Where-Object Name -eq "detail_render").Target
          $targetISource = ($sharedSources | Where-Object Name -eq "i_source").Target
          $targetUiFeedback = ($sharedSources | Where-Object Name -eq "ui_feedback").Target
          $targetAccountStyle = ($sharedSources | Where-Object Name -eq "account_style").Target

          $inputHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $inputZip).Hash.ToLowerInvariant()
          if ($inputHash -ne $env:EXPECTED_INPUT_SHA256) { throw "Windows input digest changed: $inputHash" }
          & $sevenZip t $inputZip
          if ($LASTEXITCODE -ne 0) { throw "Windows input ZIP CRC check failed." }
          & $sevenZip x -y "-o$env:GITHUB_WORKSPACE\unpack" $inputZip
          if ($LASTEXITCODE -ne 0) { throw "Windows extraction failed." }
          foreach ($required in @($sharedSources.Source + $sharedSources.Target + @(
            $state,
            $outerExe,
            $migrationExe,
            $innerExe,
            $sourceMigration,
            $sourceMigrationUi,
            $targetMigration,
            $targetMigrationUi
          ))) {
            if (-not (Test-Path -LiteralPath $required)) { throw "Missing required file: $required" }
          }

          $fileCount = (Get-ChildItem -LiteralPath $root -Recurse -Force -File).Count
          $exeHashes = @{
            outer = (Get-FileHash -Algorithm SHA256 -LiteralPath $outerExe).Hash
            migration = (Get-FileHash -Algorithm SHA256 -LiteralPath $migrationExe).Hash
            inner = (Get-FileHash -Algorithm SHA256 -LiteralPath $innerExe).Hash
          }
          $sharedHashes = @{}
          foreach ($shared in $sharedSources) {
            Copy-Item -Force -LiteralPath $shared.Source -Destination $shared.Target
            $sharedHashes[$shared.Name] = (Get-FileHash -Algorithm SHA256 -LiteralPath $shared.Source).Hash
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $shared.Target).Hash -ne $sharedHashes[$shared.Name]) {
              throw "Windows shared source copy mismatch: $($shared.Name)"
            }
          }
          Copy-Item -Force -LiteralPath $sourceMigration -Destination $targetMigration
          Copy-Item -Force -LiteralPath $sourceMigrationUi -Destination $targetMigrationUi
          $migrationHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $sourceMigration).Hash
          $migrationUiHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $sourceMigrationUi).Hash
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $targetMigration).Hash -ne $migrationHash) {
            throw "Windows migration.py copy mismatch."
          }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $targetMigrationUi).Hash -ne $migrationUiHash) {
            throw "Windows migration UI copy mismatch."
          }
          foreach ($javascript in $sharedSources | Where-Object { $_.Relative.EndsWith(".js") }) {
            node --check $javascript.Target
            if ($LASTEXITCODE -ne 0) { throw "Windows JavaScript syntax check failed: $($javascript.Relative)" }
          }
          python -c "import ast,pathlib,sys; ast.parse(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'), filename=sys.argv[1])" $targetServer
          if ($LASTEXITCODE -ne 0) { throw "Windows server.py syntax check failed." }
          python -c "import ast,pathlib,sys; ast.parse(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'), filename=sys.argv[1])" $targetMigration
          if ($LASTEXITCODE -ne 0) { throw "Windows migration.py syntax check failed." }
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $targetMigrationUi,
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count) {
            throw "Windows migration UI syntax check failed: $($parseErrors[0].Message)"
          }
          $migrationUiText = Get-Content -Raw -LiteralPath $targetMigrationUi
          foreach ($marker in @(
            '$title.Text = "Migration"',
            '$accent = [System.Drawing.Color]::FromArgb(251, 173, 46)',
            '$importLabel.Text = "+ Import other media"',
            '$importBtn.Text = "Import"',
            '"--import-media"',
            'Select-Folder "Select a folder containing media to import"'
          )) {
            if (-not $migrationUiText.Contains($marker)) { throw "Windows migration UI marker missing: $marker" }
          }
          $migrationText = Get-Content -Raw -LiteralPath $targetMigration
          foreach ($marker in @(
            'def media_files_recursive(path: Path) -> list[Path]:',
            'def import_external_media(self, media_root: Path) -> dict[str, Any]:',
            'parser.add_argument("--import-media", action="store_true")'
          )) {
            if (-not $migrationText.Contains($marker)) { throw "Windows migration marker missing: $marker" }
          }

          $migrationTestRoot = Join-Path $env:GITHUB_WORKSPACE "migration-test"
          $migrationTestSource = Join-Path $migrationTestRoot "source"
          $migrationTestNested = Join-Path $migrationTestSource "nested"
          $migrationTestTarget = Join-Path $migrationTestRoot "library"
          New-Item -ItemType Directory -Force $migrationTestNested, $migrationTestTarget | Out-Null
          Set-Content -LiteralPath (Join-Path $migrationTestSource "first.png") -Value "first" -NoNewline
          Set-Content -LiteralPath (Join-Path $migrationTestNested "second.mp4") -Value "second" -NoNewline
          python $targetMigration --import-media --source $migrationTestSource --target $migrationTestTarget
          if ($LASTEXITCODE -ne 0) { throw "Windows migration import smoke test failed." }
          $importedPosts = @(Get-ChildItem -LiteralPath (Join-Path $migrationTestTarget "created") -Recurse -File -Filter "post.json")
          if ($importedPosts.Count -ne 2) { throw "Windows migration imported post count mismatch." }
          $migrationLibrary = Get-Content -Raw -LiteralPath (Join-Path $migrationTestTarget "library.json") | ConvertFrom-Json
          if (@($migrationLibrary.posts).Count -ne 2) { throw "Windows migration library post count mismatch." }

          $composerText = Get-Content -Raw -LiteralPath $targetComposer
          foreach ($marker in @(
            'const imageCountOptions = provider === "imagine"',
            '? buildT2iCountOptions.filter((option) => option !== "1")',
            'const imageCountDefault = "5";',
            'setControlVisible(composerControls.count, !isImageToImage'
          )) {
            if (-not $composerText.Contains($marker)) { throw "Windows composer marker missing: $marker" }
          }
          $stateText = Get-Content -Raw -LiteralPath $state
          if (-not $stateText.Contains('const buildT2iCountOptions = ["10", "8", "5", "4", "1"];')) {
            throw "Build count options changed unexpectedly."
          }
          $preloadText = Get-Content -Raw -LiteralPath $targetPreload
          foreach ($marker in @(
            "const generationResponseCaptures = [];",
            "conversation_request_route_applied",
            "canonicalContainerId",
            "baselineIds: Array.from(beforeIds)",
            'const beforeIds = allCurrentIds(state, "video");',
            "!tracking.retainTrackedCandidateUntilDeadline",
            'retainTrackedCandidateUntilDeadline: tieredI2vWait || variant.kind === "textToVideo",',
            "const finalEvents = finalContainerIds.flatMap((finalContainerId) => collectStoreEvents("
          )) {
            if (-not $preloadText.Contains($marker)) { throw "Windows relation bridge marker missing: $marker" }
          }
          if ($preloadText.Contains("if (hasInProgressCandidate && now - tracking.firstCandidateSeenAt >= storeObservationMs)")) {
            throw "Windows eight-second video handoff guard is missing."
          }
          $serverText = Get-Content -Raw -LiteralPath $targetServer
          foreach ($marker in @(
            'relation_recovery_action = action in {"i2i", "i2v", "t2v", "extend"}',
            'events, bridge_parent_ids, bridge_baseline_ids, canonical_container_id = native_bridge_fetch_events(',
            'def imagine_generated_relation_baseline_ids(root: Path, source_post_path: str, expected_type: str) -> set[str]:',
            '"relation_count": relation_baseline_count',
            'def imagine_conversation_root_generation(responses: list[dict]) -> dict:',
            '"t2i_group_container": bool(root_generation.get("is_t2i_group_container"))',
            'IMAGINE_DIRECT_I2I_MAX_WAIT_SECONDS = 14'
          )) {
            if (-not $serverText.Contains($marker)) { throw "Windows relation recovery marker missing: $marker" }
          }
          $mainText = Get-Content -Raw -LiteralPath $targetMain
          foreach ($marker in @("payload.grokChameleonConversationId", 'process.platform === "darwin"', "process.resourcesPath")) {
            if (-not $mainText.Contains($marker)) { throw "Cross-platform main marker missing: $marker" }
          }
          if (-not (Get-Content -Raw -LiteralPath $targetAttachments).Contains("conversation_id: conversationId")) { throw "Attachment conversation lineage marker missing." }
          if (-not (Get-Content -Raw -LiteralPath $targetISubmit).Contains("source_conversation_id: sourceContext.conversation_id")) { throw "Submit conversation lineage marker missing." }
          if (-not (Get-Content -Raw -LiteralPath $targetLibraryCore).Contains('if (type === "image" || type.startsWith("image/"))')) { throw "Sharp image preview marker missing." }
          if (-not (Get-Content -Raw -LiteralPath $targetDetailState).Contains("function detailItemPrompt(item)")) { throw "Detail prompt lineage marker missing." }
          $detailRenderText = Get-Content -Raw -LiteralPath $targetDetailRender
          if (-not $detailRenderText.Contains("const visible = !post?.is_job_post")) { throw "Build detail heart visibility marker missing." }
          if ($detailRenderText.Contains("Boolean(post?.is_job_post)")) { throw "Build job heart visibility regression found." }
          if (-not (Get-Content -Raw -LiteralPath $targetISource).Contains("function isImagineT2iGroupContainer(post)")) { throw "T2I group filter marker missing." }
          if (-not (Get-Content -Raw -LiteralPath $targetUiFeedback).Contains('".workspace.i_detail_open .i_detail_media, .workspace.b_detail_open .b_detail_media"')) { throw "Lucky media center marker missing." }
          if (-not (Get-Content -Raw -LiteralPath $targetAccountStyle).Contains(".lucky_notice.in_detail_media")) { throw "Lucky media position marker missing." }
          $metadata = Get-ChildItem -LiteralPath $root -Recurse -Force | Where-Object {
            $_.Name -eq "__MACOSX" -or $_.Name -like "._*" -or $_.Name -eq ".DS_Store"
          }
          if ($metadata) { throw "macOS metadata exists in the Windows package." }

          Push-Location (Join-Path $env:GITHUB_WORKSPACE "unpack")
          try {
            & $sevenZip a -tzip -mx=7 $outputZip ".\Grok Chameleon"
            if ($LASTEXITCODE -ne 0) { throw "Windows ZIP creation failed." }
          } finally {
            Pop-Location
          }
          & $sevenZip t $outputZip
          if ($LASTEXITCODE -ne 0) { throw "Windows output ZIP CRC check failed." }
          & $sevenZip x -y "-o$env:GITHUB_WORKSPACE\verify" $outputZip
          if ($LASTEXITCODE -ne 0) { throw "Windows verification extraction failed." }

          $verifiedRoot = Join-Path $env:GITHUB_WORKSPACE "verify\Grok Chameleon"
          $verifiedAppRoot = Join-Path $verifiedRoot "Resources\Grok Chameleon\resources\app"
          $verifiedMigration = Join-Path $verifiedRoot "Resources\Migration\migration.py"
          $verifiedMigrationUi = Join-Path $verifiedRoot "Resources\Migration\migration_windows.ps1"
          if ((Get-ChildItem -LiteralPath $verifiedRoot -Recurse -Force -File).Count -ne $fileCount) {
            throw "Windows file count changed during packaging."
          }
          foreach ($shared in $sharedSources) {
            $verifiedPath = Join-Path $verifiedAppRoot $shared.Relative
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $verifiedPath).Hash -ne $sharedHashes[$shared.Name]) {
              throw "Windows packaged shared source mismatch: $($shared.Name)"
            }
          }
          $verifiedExeHashes = @{
            outer = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $verifiedRoot "Grok Chameleon.exe")).Hash
            migration = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $verifiedRoot "Migration.exe")).Hash
            inner = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $verifiedRoot "Resources\Grok Chameleon\Grok Chameleon.exe")).Hash
          }
          foreach ($key in @("outer", "migration", "inner")) {
            if ($verifiedExeHashes[$key] -ne $exeHashes[$key]) { throw "Windows executable changed: $key" }
          }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $verifiedMigration).Hash -ne $migrationHash) {
            throw "Packaged Windows migration.py mismatch."
          }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $verifiedMigrationUi).Hash -ne $migrationUiHash) {
            throw "Packaged Windows migration UI mismatch."
          }
          foreach ($javascript in $sharedSources | Where-Object { $_.Relative.EndsWith(".js") }) {
            node --check (Join-Path $verifiedAppRoot $javascript.Relative)
            if ($LASTEXITCODE -ne 0) { throw "Packaged Windows JavaScript syntax check failed: $($javascript.Relative)" }
          }
          python -c "import ast,pathlib,sys; ast.parse(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'), filename=sys.argv[1])" (Join-Path $verifiedAppRoot "runtime\server.py")
          if ($LASTEXITCODE -ne 0) { throw "Packaged Windows server syntax check failed." }
          "windows-output-sha256=" + (Get-FileHash -Algorithm SHA256 -LiteralPath $outputZip).Hash.ToLowerInvariant()

      - name: Retain the verified Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows-common-source-build
          path: output/Win_Grok_Chameleon_a.zip
          if-no-files-found: error
          retention-days: 3

  build-macos:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      RELEASE_TAG: v20260720-042100-mac
      INPUT_ZIP: Mac_Grok_Chameleon_a.zip
      OUTPUT_ZIP: Mac_Grok_Chameleon_a.zip
      EXPECTED_INPUT_SHA256: 0227b5e8d0dc4a81222291c8fa992f84281f4eeda74f552eb0bc6f8a51cccf88

    steps:
      - name: Check out the shared source commit
        uses: actions/checkout@v4

      - name: Download the exact Mac runtime package
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p input
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$INPUT_ZIP" --dir input
          actual="$(shasum -a 256 "input/$INPUT_ZIP" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_INPUT_SHA256"

      - name: Assemble Mac from the shared source
        shell: bash
        run: |
          set -euo pipefail
          export COPYFILE_DISABLE=1
          mkdir -p unpack output verify
          ditto -x -k "input/$INPUT_ZIP" unpack
          root="$PWD/unpack/Grok Chameleon"
          main_app="$root/Grok Chameleon.app"
          migration_app="$root/Migration.app"
          app_root="$main_app/Contents/Resources/app"
          common_root="$GITHUB_WORKSPACE/common/app"
          common_migration="$GITHUB_WORKSPACE/$COMMON_MIGRATION"
          migration_swift="$GITHUB_WORKSPACE/$MACOS_MIGRATION_UI"
          migration_py="$migration_app/Contents/Resources/migration.py"
          shared_relatives=(
            electron/main.js
            electron/preload-bridge.js
            runtime/server.py
            web/scripts/composer_options.js
            web/scripts/composer_attachments.js
            web/scripts/i_composer_submit.js
            web/scripts/library_core.js
            web/scripts/detail_state.js
            web/scripts/detail_render.js
            web/scripts/i_source_render.js
            web/scripts/ui_feedback.js
            web/styles/account.css
          )
          target="$app_root/web/scripts/composer_options.js"
          main_js="$app_root/electron/main.js"
          preload_js="$app_root/electron/preload-bridge.js"
          server_py="$app_root/runtime/server.py"
          attachments_js="$app_root/web/scripts/composer_attachments.js"
          i_submit_js="$app_root/web/scripts/i_composer_submit.js"
          library_core_js="$app_root/web/scripts/library_core.js"
          detail_state_js="$app_root/web/scripts/detail_state.js"
          detail_render_js="$app_root/web/scripts/detail_render.js"
          i_source_js="$app_root/web/scripts/i_source_render.js"
          ui_feedback_js="$app_root/web/scripts/ui_feedback.js"
          account_css="$app_root/web/styles/account.css"
          main_exec="$main_app/Contents/MacOS/Grok Chameleon"
          migration_exec="$migration_app/Contents/MacOS/Migration"

          for relative in "${shared_relatives[@]}"; do
            test -f "$common_root/$relative"
            test -f "$app_root/$relative"
          done
          test -x "$main_exec"
          test -x "$migration_exec"
          test -f "$common_migration"
          test -f "$migration_swift"
          test -f "$migration_py"
          test -L "$main_app/Contents/Frameworks/Electron Framework.framework/Versions/Current"
          test -L "$main_app/Contents/Frameworks/Electron Framework.framework/Electron Framework"
          find "$app_root/vendor/python" -type f -name '*darwin.so' -print -quit | grep -q .
          if find "$root" \( -name '__MACOSX' -o -name '._*' -o -name '.DS_Store' \) -print | grep -q .; then
            echo 'AppleDouble or Finder metadata found in Mac input.' >&2
            exit 1
          fi

          for relative in "${shared_relatives[@]}"; do
            cp "$common_root/$relative" "$app_root/$relative"
            cmp "$common_root/$relative" "$app_root/$relative"
            if [[ "$relative" == *.js ]]; then
              node --check "$app_root/$relative"
            fi
          done
          cp "$common_migration" "$migration_py"
          cmp "$common_migration" "$migration_py"
          xcrun swiftc \
            -parse-as-library \
            -O \
            -target arm64-apple-macos13.0 \
            "$migration_swift" \
            -o "$migration_exec"
          chmod 755 "$migration_exec"
          file "$migration_exec" | grep -F 'arm64'
          strings "$migration_exec" | grep -Fx 'Migration'
          strings "$migration_exec" | grep -Fx '+ Import other media'
          python3 - "$server_py" <<'PY'
          import ast
          import pathlib
          import sys
          path = pathlib.Path(sys.argv[1])
          ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          PY
          grep -F 'const imageCountOptions = provider === "imagine"' "$target"
          grep -F '? buildT2iCountOptions.filter((option) => option !== "1")' "$target"
          grep -F 'const imageCountDefault = "5";' "$target"
          grep -F 'const generationResponseCaptures = [];' "$preload_js"
          grep -F 'conversation_request_route_applied' "$preload_js"
          grep -F 'canonicalContainerId' "$preload_js"
          grep -F 'baselineIds: Array.from(beforeIds)' "$preload_js"
          grep -F 'const beforeIds = allCurrentIds(state, "video");' "$preload_js"
          grep -F '!tracking.retainTrackedCandidateUntilDeadline' "$preload_js"
          grep -F 'retainTrackedCandidateUntilDeadline: tieredI2vWait || variant.kind === "textToVideo",' "$preload_js"
          grep -F 'const finalEvents = finalContainerIds.flatMap((finalContainerId) => collectStoreEvents(' "$preload_js"
          if grep -F 'if (hasInProgressCandidate && now - tracking.firstCandidateSeenAt >= storeObservationMs)' "$preload_js"; then
            echo 'Mac eight-second video handoff guard is missing.' >&2
            exit 1
          fi
          grep -F 'relation_recovery_action = action in {"i2i", "i2v", "t2v", "extend"}' "$server_py"
          grep -F 'events, bridge_parent_ids, bridge_baseline_ids, canonical_container_id = native_bridge_fetch_events(' "$server_py"
          grep -F 'def imagine_generated_relation_baseline_ids(root: Path, source_post_path: str, expected_type: str) -> set[str]:' "$server_py"
          grep -F '"relation_count": relation_baseline_count' "$server_py"
          grep -F 'def imagine_conversation_root_generation(responses: list[dict]) -> dict:' "$server_py"
          grep -F '"t2i_group_container": bool(root_generation.get("is_t2i_group_container"))' "$server_py"
          grep -F 'IMAGINE_DIRECT_I2I_MAX_WAIT_SECONDS = 14' "$server_py"
          grep -F 'conversation_id: conversationId' "$attachments_js"
          grep -F 'source_conversation_id: sourceContext.conversation_id' "$i_submit_js"
          grep -F 'if (type === "image" || type.startsWith("image/"))' "$library_core_js"
          grep -F 'function detailItemPrompt(item)' "$detail_state_js"
          grep -F 'const visible = !post?.is_job_post' "$detail_render_js"
          if grep -F 'Boolean(post?.is_job_post)' "$detail_render_js"; then
            echo 'Build job heart visibility regression found.' >&2
            exit 1
          fi
          grep -F 'function isImagineT2iGroupContainer(post)' "$i_source_js"
          grep -F '".workspace.i_detail_open .i_detail_media, .workspace.b_detail_open .b_detail_media"' "$ui_feedback_js"
          grep -F '.lucky_notice.in_detail_media' "$account_css"
          grep -F 'RUNTIME_ROOT = Path(__file__).resolve().parent' "$server_py"
          grep -F 'APP_ROOT = RUNTIME_ROOT.parent' "$server_py"
          if grep -E 'C:\\|python\.exe' "$server_py"; then
            echo 'Windows-only path leaked into Mac server.py.' >&2
            exit 1
          fi
          grep -F 'process.platform === "darwin"' "$main_js"
          grep -F 'process.resourcesPath' "$main_js"
          grep -F 'path.join(resourceRoot, "Python", "bin", "python3")' "$main_js"
          grep -F 'app.on("activate"' "$main_js"
          grep -F 'app.on("window-all-closed"' "$main_js"
          python3 - "$migration_py" <<'PY'
          import ast
          import pathlib
          import sys
          path = pathlib.Path(sys.argv[1])
          ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          PY
          grep -F 'def media_files_recursive(path: Path) -> list[Path]:' "$migration_py"
          grep -F 'def import_external_media(self, media_root: Path) -> dict[str, Any]:' "$migration_py"
          grep -F 'parser.add_argument("--import-media", action="store_true")' "$migration_py"

          migration_test="$(mktemp -d)"
          mkdir -p "$migration_test/source/nested" "$migration_test/library"
          printf first > "$migration_test/source/first.png"
          printf second > "$migration_test/source/nested/second.mp4"
          PYTHONDONTWRITEBYTECODE=1 python3 "$migration_py" \
            --import-media \
            --source "$migration_test/source" \
            --target "$migration_test/library"
          test "$(find "$migration_test/library/created" -type f -name post.json | wc -l | tr -d ' ')" = 2
          python3 - "$migration_test/library/library.json" <<'PY'
          import json
          import pathlib
          import sys
          library = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          if len(library.get("posts") or []) != 2:
              raise SystemExit("Mac migration library post count mismatch.")
          PY

      - name: Sign, package, and verify Mac without ZIP -47 regressions
        shell: bash
        run: |
          set -euo pipefail
          export COPYFILE_DISABLE=1
          root="$PWD/unpack/Grok Chameleon"
          main_app="$root/Grok Chameleon.app"
          migration_app="$root/Migration.app"
          app_root="$main_app/Contents/Resources/app"
          common_root="$GITHUB_WORKSPACE/common/app"
          shared_relatives=(
            electron/main.js
            electron/preload-bridge.js
            runtime/server.py
            web/scripts/composer_options.js
            web/scripts/composer_attachments.js
            web/scripts/i_composer_submit.js
            web/scripts/library_core.js
            web/scripts/detail_state.js
            web/scripts/detail_render.js
            web/scripts/i_source_render.js
          )
          if find "$root" -type d -name '__pycache__' -print | grep -q .; then
            echo 'Python cache found before Mac packaging.' >&2
            exit 1
          fi
          xattr -cr "$root"
          if xattr -lr "$root" 2>/dev/null | grep -q 'com.apple.quarantine'; then
            echo 'Quarantine attribute remains before Mac signing.' >&2
            exit 1
          fi
          codesign --force --sign - --timestamp=none "$migration_app"
          codesign --force --sign - --timestamp=none "$main_app"
          codesign --verify --deep --strict --verbose=4 "$migration_app"
          codesign --verify --deep --strict --verbose=4 "$main_app"
          plutil -lint "$migration_app/Contents/Info.plist"
          plutil -lint "$main_app/Contents/Info.plist"
          xattr -cr "$root"
          ditto -c -k --keepParent --norsrc --noextattr --noacl --noqtn "$root" "output/$OUTPUT_ZIP"
          unzip -t "output/$OUTPUT_ZIP"
          if zipinfo -1 "output/$OUTPUT_ZIP" | grep -E '(^|/)(__MACOSX|\._|\.DS_Store)(/|$)'; then
            echo 'AppleDouble or Finder metadata found in Mac output.' >&2
            exit 1
          fi

          ditto -x -k "output/$OUTPUT_ZIP" verify
          verified_root="$PWD/verify/Grok Chameleon"
          verified_main="$verified_root/Grok Chameleon.app"
          verified_migration="$verified_root/Migration.app"
          verified_app="$verified_main/Contents/Resources/app"
          verified_server="$verified_app/runtime/server.py"
          verified_migration_py="$verified_migration/Contents/Resources/migration.py"
          test -x "$verified_main/Contents/MacOS/Grok Chameleon"
          test -x "$verified_migration/Contents/MacOS/Migration"
          file "$verified_migration/Contents/MacOS/Migration" | grep -F 'arm64'
          cmp "$GITHUB_WORKSPACE/$COMMON_MIGRATION" "$verified_migration_py"
          test -L "$verified_main/Contents/Frameworks/Electron Framework.framework/Versions/Current"
          test -L "$verified_main/Contents/Frameworks/Electron Framework.framework/Electron Framework"
          codesign --verify --deep --strict --verbose=4 "$verified_main"
          codesign --verify --deep --strict --verbose=4 "$verified_migration"
          for relative in "${shared_relatives[@]}"; do
            cmp "$common_root/$relative" "$verified_app/$relative"
            if [[ "$relative" == *.js ]]; then
              node --check "$verified_app/$relative"
            fi
          done
          python3 - "$verified_server" <<'PY'
          import ast
          import pathlib
          import sys
          path = pathlib.Path(sys.argv[1])
          ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          PY
          if find "$verified_root" \( -name '__MACOSX' -o -name '._*' -o -name '.DS_Store' -o -name '__pycache__' \) -print | grep -q .; then
            echo 'Forbidden metadata found after final Mac extraction.' >&2
            exit 1
          fi
          if xattr -lr "$verified_root" 2>/dev/null | grep -q 'com.apple.quarantine'; then
            echo 'Quarantine attribute found after final Mac extraction.' >&2
            exit 1
          fi
          ELECTRON_RUN_AS_NODE=1 "$verified_main/Contents/MacOS/Grok Chameleon" -e 'console.log("MAC_ELECTRON_OK")'
          shasum -a 256 "output/$OUTPUT_ZIP"

      - name: Retain the verified Mac build
        uses: actions/upload-artifact@v4
        with:
          name: mac-common-source-build
          path: output/Mac_Grok_Chameleon_a.zip
          if-no-files-found: error
          retention-days: 3

  publish:
    environment: release-update-approval
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - build-windows
      - build-macos
    steps:
      - name: Download the verified Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-common-source-build
          path: release/windows

      - name: Download the verified Mac build
        uses: actions/download-artifact@v4
        with:
          name: mac-common-source-build
          path: release/macos

      - name: Preserve and replace both release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_TAG: v20260720-041036-win
          MAC_TAG: v20260720-042100-mac
          WIN_ZIP: Win_Grok_Chameleon_a.zip
          MAC_ZIP: Mac_Grok_Chameleon_a.zip
          WIN_INPUT_SHA256: f4799a687810490cb6b5d009cf3e43902231952fe9d4bbf6ebb5cf8df0c7d465
          MAC_INPUT_SHA256: 0227b5e8d0dc4a81222291c8fa992f84281f4eeda74f552eb0bc6f8a51cccf88
        run: |
          set -euo pipefail
          mkdir -p current/win current/mac backups
          gh release download "$WIN_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$WIN_ZIP" --dir current/win
          gh release download "$MAC_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$MAC_ZIP" --dir current/mac
          test "$(sha256sum "current/win/$WIN_ZIP" | awk '{print $1}')" = "$WIN_INPUT_SHA256"
          test "$(sha256sum "current/mac/$MAC_ZIP" | awk '{print $1}')" = "$MAC_INPUT_SHA256"
          short_sha="$(printf '%s' "$GITHUB_SHA" | cut -c1-12)"
          win_backup="Win_Grok_Chameleon_a.previous-before-video-retention-restore-$short_sha.zip"
          mac_backup="Mac_Grok_Chameleon_a.previous-before-video-retention-restore-$short_sha.zip"
          cp "current/win/$WIN_ZIP" "backups/$win_backup"
          cp "current/mac/$MAC_ZIP" "backups/$mac_backup"
          gh release upload "$WIN_TAG" "backups/$win_backup" --repo "$GITHUB_REPOSITORY"
          gh release upload "$MAC_TAG" "backups/$mac_backup" --repo "$GITHUB_REPOSITORY"

          rollback() {
            echo 'Rolling back both production assets.' >&2
            gh release upload "$WIN_TAG" "current/win/$WIN_ZIP" --repo "$GITHUB_REPOSITORY" --clobber || true
            gh release upload "$MAC_TAG" "current/mac/$MAC_ZIP" --repo "$GITHUB_REPOSITORY" --clobber || true
          }
          trap rollback ERR
          gh release upload "$WIN_TAG" "release/windows/$WIN_ZIP" --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$MAC_TAG" "release/macos/$MAC_ZIP" --repo "$GITHUB_REPOSITORY" --clobber
          win_local="sha256:$(sha256sum "release/windows/$WIN_ZIP" | awk '{print $1}')"
          mac_local="sha256:$(sha256sum "release/macos/$MAC_ZIP" | awk '{print $1}')"
          win_remote="$(gh release view "$WIN_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name == "'"$WIN_ZIP"'") | .digest')"
          mac_remote="$(gh release view "$MAC_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name == "'"$MAC_ZIP"'") | .digest')"
          test "$win_local" = "$win_remote"
          test "$mac_local" = "$mac_remote"
          trap - ERR
          echo "windows-production-digest=$win_remote"
          echo "mac-production-digest=$mac_remote"
