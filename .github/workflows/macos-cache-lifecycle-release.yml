          grep -F 'const beforeIds = allCurrentIds(state, "video");' "$preload_js"
          grep -F '!tracking.retainTrackedCandidateUntilDeadline' "$preload_js"
          grep -F 'retainTrackedCandidateUntilDeadline: tieredI2vWait || variant.kind === "textToVideo",' "$preload_js"
          grep -F 'const finalEvents = finalContainerIds.flatMap((finalContainerId) => collectStoreEvents(' "$preload_js"
          if grep -F 'if (hasInProgressCandidate && now - tracking.firstCandidateSeenAt >= storeObservationMs)' "$preload_js"; then
            echo 'Mac eight-second video handoff guard is missing.' >&2
            exit 1
          fi
          grep -F 'import imagine_state' "$server_py"
          grep -F 'def normalize_json_unicode(value):' "$server_py"
          grep -F '"database": "sql_data/state.sqlite3"' "$server_py"
          grep -F 'STATE_DIRECTORY = "sql_data"' "$imagine_state_py"
          grep -F 'unicodedata.normalize("NFC"' "$imagine_state_py"
          grep -F 'CREATE TABLE IF NOT EXISTS account_registry' "$imagine_state_py"
          grep -F 'def sync_snapshot(root: Path) -> bool:' "$imagine_state_py"
          grep -F 'relation_recovery_action = action in {"i2i", "i2v", "t2v", "extend"}' "$server_py"
          grep -F 'events, bridge_parent_ids, bridge_baseline_ids, canonical_container_id = native_bridge_fetch_events(' "$server_py"
          grep -F 'def imagine_generated_relation_baseline_ids(root: Path, source_post_path: str, expected_type: str) -> set[str]:' "$server_py"
          grep -F '"relation_count": relation_baseline_count' "$server_py"
          grep -F 'def imagine_conversation_root_generation(responses: list[dict]) -> dict:' "$server_py"
          grep -F '"t2i_group_container": bool(root_generation.get("is_t2i_group_container"))' "$server_py"
          grep -F 'IMAGINE_DIRECT_I2I_MAX_WAIT_SECONDS = 14' "$server_py"
          grep -F 'COLLECTION_MOVE_LOCK = threading.Lock()' "$server_py"
          grep -F 'def thumbnail_file_names(folder: Path, meta: dict | None = None) -> set[str]:' "$server_py"
          grep -F 'existing = existing_remote_collection_post(target_parent, source_post, items)' "$server_py"
          grep -F 'def is_grok_preview_image_file_name(name: str) -> bool:' "$server_py"
          grep -F 'target_parent = root / "created"' "$server_py"
          grep -F 'def merged_post_source(posts: list[dict]) -> str:' "$server_py"
          grep -F 'saved_keys = imagine_saved_media_keys_cached(account, max_posts=0)' "$server_py"
          grep -F 'def build_preview_dir(kind: str, root: Path | None = None) -> Path:' "$server_py"
          grep -F 'def remove_build_previews_for_tree(root: Path, folder: Path) -> None:' "$server_py"
          grep -F 'cleaned_items = remove_embedded_preview_files(target_dir, post.get("items") or [])' "$server_py"
          grep -F 'if parsed.path == "/api/build-preview":' "$server_py"
          grep -F 'ACCOUNT_TIER_SORT_ORDER = {"heavy": 0, "super": 1, "free": 2}' "$server_py"
          grep -F 'def sort_accounts_by_priority(accounts: list[dict], active_id: str = "") -> list[dict]:' "$server_py"
          grep -F 'write_build_auth(root, store, preserve_order=True)' "$server_py"
          grep -F 'def oauth_browser_error(target: dict | None) -> str:' "$server_py"
          grep -F 'def build_account_is_denied(account: dict | None) -> bool:' "$server_py"
          grep -F 'failed_build_id = account_id(' "$server_py"
          grep -F 'verify_imagine_saved_access(normalize_imagine_account({' "$server_py"
          if grep -E 'supergrokheavy|freecreditswithsupergrok|supergrok포함무료크레딧' "$imagine_accounts_py"; then
            echo 'Account tier marketing fallback remains.' >&2
            exit 1
          fi
          grep -F 'const accountTierSortOrder = { heavy: 0, super: 1, free: 2 };' "$prompt_account_js"
          grep -F 'function sortAccountCardsByPriority(provider)' "$prompt_account_js"
          grep -F 'row.draggable = true;' "$prompt_account_js"
          grep -F 'if (targetIndex >= 0 && from < targetIndex) to += 1;' "$prompt_account_js"
          grep -F 'if (status === "denied") return "Denied";' "$prompt_account_js"
          grep -F 'if (provider === "build" && status === "denied") {' "$prompt_account_js"
          grep -F 'function isDeniedBuildAccount(account)' "$account_core_js"
          grep -F 'function firstSelectableBuildAccountId(accounts)' "$account_core_js"
          grep -F 'storedBackTarget.scrollTop = scrollTop' "$card_render_js"
          grep -F 'function restoreImagineListScrollForScreen(screenId, scrollTop)' "$i_detail_actions_js"
          grep -F 'restoreImagineListScrollForScreen(returnScreenId, returnScrollTop)' "$i_detail_actions_js"
          grep -F 'function syncComposerScrollClearance()' "$composer_events_js"
          grep -F '.i_discover_card_list, .prompt_card_list, .second_main_card_list' "$composer_events_js"
          grep -F '"prompt_main"' "$composer_events_js"
          grep -F '"2nd_main"' "$composer_events_js"
          grep -F -- '--composer-scroll-clearance' "$cards_prompt_css"
          grep -F '.search_card_list,' "$cards_prompt_css"
          grep -F '.i_discover_card_list,' "$cards_prompt_css"
          grep -F '.i_unsaved_card_list,' "$cards_prompt_css"
          grep -F '.prompt_card_list,' "$cards_prompt_css"
          grep -F '.second_main_card_list' "$cards_prompt_css"
          grep -F 'id="b_collection_filter_btn"' "$index_html"
          grep -F 'buildIncludeCollections: false' "$state_js"
          grep -F 'library_state.buildIncludeCollections && post?.items?.length' "$build_main_js"
          grep -F 'const collectionMode = library_state.buildIncludeCollections ? "with-collection" : "without-collection";' "$b_source_js"
          grep -F 'document.getElementById("b_collection_filter_btn")?.addEventListener' "$sidebar_events_js"
          grep -F 'gap: 70px;' "$main_css"
          grep -F 'conversation_id: conversationId' "$attachments_js"
          grep -F 'source_conversation_id: sourceContext.conversation_id' "$i_submit_js"
          grep -F 'const completedMode = String(job.context?.mode || "").toLowerCase();' "$b_submit_js"
          grep -F 'new Set(["i2i", "i2v"])' "$i_submit_js"
          grep -F 'if (type === "image" || type.startsWith("image/"))' "$library_core_js"
          grep -F 'function detailItemPrompt(item)' "$detail_state_js"
          grep -F 'resolveLocalCardPreview(url, kind = "card")' "$detail_media_js"
          grep -F 'const visible = !post?.is_job_post' "$detail_render_js"
          grep -F 'resolveLocalCardPreview(buildPreviewSource, "thumbnail")' "$detail_render_js"
          if grep -F 'Boolean(post?.is_job_post)' "$detail_render_js"; then
            echo 'Build job heart visibility regression found.' >&2
            exit 1
          fi
          grep -F 'function isImagineT2iGroupContainer(post)' "$i_source_js"
          grep -F 'screen_state.current_screen === "i_unsaved_main"' "$i_source_js"
          grep -F 'let moveToCollectionRequestPending = false;' "$collection_actions_js"
          grep -F 'if (moveToCollectionRequestPending) return;' "$collection_actions_js"
          grep -F 'moveToCollectionRequestPending = true;' "$collection_actions_js"
          grep -F 'moveToCollectionRequestPending = false;' "$collection_actions_js"
          python3 - "$prompt_events_js" <<'PY'
          import pathlib
          import re
          import sys
          text = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          pattern = r'document\.querySelector\("\.prompt_write_btn"\)\?\.addEventListener\("click", \(\) => \{\s*openPromptSave\(\);\s*\}\);'
          if not re.search(pattern, text, re.S):
              raise SystemExit("Prompt Write does not open the shared prompt save dialog.")
          PY
          grep -F '".workspace.i_detail_open .i_detail_media, .workspace.b_detail_open .b_detail_media"' "$ui_feedback_js"
          grep -F '.lucky_notice.in_detail_media' "$account_css"
          grep -F 'function scheduleLocalCardVideoPoster(' "$detail_media_js"
          if grep -F 'card_static_video_preview' "$card_render_js"; then
            echo 'Static Build video card preview regression found.' >&2
            exit 1
          fi
          grep -F 'const CARD_PREVIEW_MAX_EDGE = 960;' "$main_js"
          grep -F 'RUNTIME_ROOT = Path(__file__).resolve().parent' "$server_py"
          grep -F 'APP_ROOT = RUNTIME_ROOT.parent' "$server_py"
          if grep -E 'C:\\|python\.exe' "$server_py"; then
            echo 'Windows-only path leaked into Mac server.py.' >&2
            exit 1
          fi
          grep -F 'process.platform === "darwin"' "$main_js"
          grep -F 'process.resourcesPath' "$main_js"
          grep -F 'path.join(resourceRoot, "Python", "bin", "python3")' "$main_js"
          grep -F 'const LIBRARY_POINTER_PATH = path.join(PORTABLE_ROOT, ".library_path.json");' "$main_js"
          grep -F '? path.join(SELECTED_LIBRARY_ROOT, "runtime_data")' "$main_js"
          grep -F 'app.setPath("userData", RUNTIME_DIR);' "$main_js"
          grep -F 'function verifiedLibraryCardPreviewCacheDir(info = {})' "$main_js"
          grep -F 'function verifiedLibraryBuildPreviewDir(info = {}, kind = "card")' "$main_js"
          grep -F 'const expectedCacheDir = path.resolve(resolvedLibraryRoot, "cache", "card-previews");' "$main_js"
          grep -F 'normalizedKind === "thumbnail" ? "thumbnails" : "cards"' "$main_js"
          grep -F 'await clearCurrentCardPreviewCache("startup");' "$main_js"
          grep -F 'app.on("activate"' "$main_js"
          grep -F 'app.on("window-all-closed"' "$main_js"
          rm -rf \
            "$migration_app" \
            "$root/.library_path.json" \
            "$root/library_path.json" \
            "$root/runtime_data" \
            "$root/sql_data"
          test ! -e "$migration_app"
          test ! -e "$root/.library_path.json"
          test ! -e "$root/library_path.json"
          test ! -e "$root/runtime_data"
          test ! -e "$root/sql_data"
          ditto "$root" "$u_root"
          u_app_relative="unpack/Grok Chameleon U/Grok Chameleon.app/Contents/Resources/app"
          git apply --check --unsafe-paths --directory="$u_app_relative" "$variant_patch"
          git apply --unsafe-paths --directory="$u_app_relative" "$variant_patch"
          for relative in "${shared_relatives[@]}"; do
            test -f "$u_app_root/$relative"
            if [[ "$relative" == *.js ]]; then
              node --check "$u_app_root/$relative"
            fi
          done
          for relative in runtime/server.py runtime/imagine_state.py runtime/imagine_accounts.py runtime/imagine_routes.py; do
            python3 - "$u_app_root/$relative" <<'PY'
          import ast
          import pathlib
          import sys
          path = pathlib.Path(sys.argv[1])
          ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          PY
          done
          test -x "$u_main_app/Contents/MacOS/Grok Chameleon"
          test -L "$u_main_app/Contents/Frameworks/Electron Framework.framework/Versions/Current"
          test -L "$u_main_app/Contents/Frameworks/Electron Framework.framework/Electron Framework"
          if find "$root" "$u_root" \( -name '__MACOSX' -o -name '._*' -o -name '.DS_Store' \) -print | grep -q .; then
            echo 'AppleDouble or Finder metadata found after A/U assembly.' >&2
            exit 1
          fi

      - name: Sign, package, and verify Mac without ZIP -47 regressions
        shell: bash
        run: |
          set -euo pipefail
          export COPYFILE_DISABLE=1
          root="$PWD/unpack/Grok Chameleon"
          u_root="$PWD/unpack/Grok Chameleon U"
          main_app="$root/Grok Chameleon.app"
          u_main_app="$u_root/Grok Chameleon.app"
          app_root="$main_app/Contents/Resources/app"
          u_app_root="$u_main_app/Contents/Resources/app"
          common_root="$GITHUB_WORKSPACE/common/app"
          shared_relatives=(
            electron/main.js
            electron/preload-bridge.js
            runtime/server.py
            runtime/imagine_state.py
            runtime/imagine_accounts.py
            runtime/imagine_routes.py
            web/index.html
            web/scripts/state.js
            web/scripts/build_main.js
            web/scripts/b_composer_submit.js
            web/scripts/b_source_render.js
            web/scripts/sidebar_events.js
            web/styles/sidebar.css
            web/scripts/collection_events.js
            web/styles/collection.css
            web/styles/main.css
            web/scripts/card_render.js
            web/scripts/card_actions.js
            web/scripts/screen_events.js
            web/scripts/screen_router.js
            web/scripts/i_detail_actions.js
            web/scripts/composer_events.js
            web/styles/cards_prompt.css
            web/scripts/composer_options.js
            web/scripts/composer_attachments.js
            web/scripts/i_composer_submit.js
            web/scripts/library_core.js
            web/scripts/detail_state.js
            web/scripts/detail_media.js
            web/scripts/detail_render.js
            web/styles/detail.css
            web/scripts/i_source_render.js
            web/scripts/imagine_main.js
            web/scripts/render.js
            web/scripts/collection_actions.js
            web/scripts/prompt_events.js
            web/scripts/prompt_account.js
            web/scripts/account_core.js
            web/scripts/ui_feedback.js
            web/styles/account.css
          )
          if find "$root" -type d -name '__pycache__' -print | grep -q .; then
            echo 'Python cache found before Mac packaging.' >&2
            exit 1
          fi
          if find "$u_root" -type d -name '__pycache__' -print | grep -q .; then
            echo 'Python cache found in U before Mac packaging.' >&2
            exit 1
          fi
          xattr -cr "$root" "$u_root"
          if xattr -lr "$root" "$u_root" 2>/dev/null | grep -q 'com.apple.quarantine'; then
            echo 'Quarantine attribute remains before Mac signing.' >&2
            exit 1
          fi
          codesign --force --sign - --timestamp=none "$main_app"
          codesign --force --sign - --timestamp=none "$u_main_app"
          codesign --verify --deep --strict --verbose=4 "$main_app"
          codesign --verify --deep --strict --verbose=4 "$u_main_app"
          plutil -lint "$main_app/Contents/Info.plist"
          plutil -lint "$u_main_app/Contents/Info.plist"
          xattr -cr "$root" "$u_root"
          ditto -c -k --keepParent --norsrc --noextattr --noacl --noqtn "$root" "output/$OUTPUT_ZIP"
          ditto -c -k --keepParent --norsrc --noextattr --noacl --noqtn "$u_root" "output/$OUTPUT_U_ZIP"
          unzip -t "output/$OUTPUT_ZIP" >/dev/null
          unzip -t "output/$OUTPUT_U_ZIP" >/dev/null
          if {
            zipinfo -1 "output/$OUTPUT_ZIP"
            zipinfo -1 "output/$OUTPUT_U_ZIP"
          } | grep -E '(^|/)(__MACOSX|\._|\.DS_Store)(/|$)'; then
            echo 'AppleDouble or Finder metadata found in Mac output.' >&2
            exit 1
          fi

          mkdir -p verify/a verify/u
          ditto -x -k "output/$OUTPUT_ZIP" verify/a
          ditto -x -k "output/$OUTPUT_U_ZIP" verify/u
          verified_root="$PWD/verify/a/Grok Chameleon"
          verified_u_root="$PWD/verify/u/Grok Chameleon U"
          verified_main="$verified_root/Grok Chameleon.app"
          verified_u_main="$verified_u_root/Grok Chameleon.app"
          verified_app="$verified_main/Contents/Resources/app"
          verified_u_app="$verified_u_main/Contents/Resources/app"
          verified_server="$verified_app/runtime/server.py"
          verified_imagine_state="$verified_app/runtime/imagine_state.py"
          verified_imagine_accounts="$verified_app/runtime/imagine_accounts.py"
          verified_imagine_routes="$verified_app/runtime/imagine_routes.py"
          test -x "$verified_main/Contents/MacOS/Grok Chameleon"
          test -x "$verified_u_main/Contents/MacOS/Grok Chameleon"
          test -L "$verified_main/Contents/Frameworks/Electron Framework.framework/Versions/Current"
          test -L "$verified_main/Contents/Frameworks/Electron Framework.framework/Electron Framework"
          test -L "$verified_u_main/Contents/Frameworks/Electron Framework.framework/Versions/Current"
          test -L "$verified_u_main/Contents/Frameworks/Electron Framework.framework/Electron Framework"
          codesign --verify --deep --strict --verbose=4 "$verified_main"
          codesign --verify --deep --strict --verbose=4 "$verified_u_main"
          for relative in "${shared_relatives[@]}"; do
            cmp "$common_root/$relative" "$verified_app/$relative"
            cmp "$u_app_root/$relative" "$verified_u_app/$relative"
            if [[ "$relative" == *.js ]]; then
              node --check "$verified_app/$relative"
              node --check "$verified_u_app/$relative"
            fi
          done
          python3 - "$verified_server" <<'PY'
          import ast
          import pathlib
          import sys
          path = pathlib.Path(sys.argv[1])
          ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          PY
          python3 - "$verified_imagine_state" <<'PY'
          import ast
          import pathlib
          import sys
          path = pathlib.Path(sys.argv[1])
          ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          PY
          python3 - "$verified_imagine_accounts" <<'PY'
          import ast
          import pathlib
          import sys
          path = pathlib.Path(sys.argv[1])
          ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          PY
          python3 - "$verified_imagine_routes" <<'PY'
          import ast
          import pathlib
          import sys
          path = pathlib.Path(sys.argv[1])
          ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          PY
          if find "$verified_root" "$verified_u_root" \( -name '__MACOSX' -o -name '._*' -o -name '.DS_Store' -o -name '__pycache__' \) -print | grep -q .; then
            echo 'Forbidden metadata found after final Mac extraction.' >&2
            exit 1
          fi
          if xattr -lr "$verified_root" "$verified_u_root" 2>/dev/null | grep -q 'com.apple.quarantine'; then
            echo 'Quarantine attribute found after final Mac extraction.' >&2
            exit 1
          fi
          ELECTRON_RUN_AS_NODE=1 "$verified_main/Contents/MacOS/Grok Chameleon" -e 'console.log("MAC_ELECTRON_OK")'
          ELECTRON_RUN_AS_NODE=1 "$verified_u_main/Contents/MacOS/Grok Chameleon" -e 'console.log("MAC_U_ELECTRON_OK")'
          shasum -a 256 "output/$OUTPUT_ZIP"
          shasum -a 256 "output/$OUTPUT_U_ZIP"

      - name: Retain the verified Mac build
        uses: actions/upload-artifact@v4
        with:
          name: mac-common-source-build
          path: |
            output/Mac_Grok_Chameleon_a.zip
            output/Mac_Grok_Chameleon_u.zip
          if-no-files-found: error
          retention-days: 3

  publish:
    environment: release-update-approval
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - build-windows
      - build-macos
    steps:
      - name: Download the verified Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-common-source-build
          path: release/windows

      - name: Download the verified Mac build
        uses: actions/download-artifact@v4
        with:
          name: mac-common-source-build
          path: release/macos

      - name: Preserve and replace both release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_TAG: v20260720-041036-win
          MAC_TAG: v20260720-042100-mac
          WIN_ZIP: Win_Grok_Chameleon_a.zip
          WIN_U_ZIP: Win_Grok_Chameleon_u.zip
          MAC_ZIP: Mac_Grok_Chameleon_a.zip
          MAC_U_ZIP: Mac_Grok_Chameleon_u.zip
          WIN_INPUT_SHA256: 3d6a7303d0db0eb0515b85597a35810a43c39333551a3aecdbe4b81cfef1f75e
          MAC_INPUT_SHA256: eb879bb20e55cb9d97c5a70b1463c3a3fb3186d8a5ed7d67033cb5a625f6b947
        run: |
          set -euo pipefail
          mkdir -p current/win current/win-u current/mac current/mac-u backups
          gh release download "$WIN_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$WIN_ZIP" --dir current/win
          gh release download "$MAC_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$MAC_ZIP" --dir current/mac
          gh release download "$WIN_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$WIN_U_ZIP" --dir current/win-u || true
          gh release download "$MAC_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$MAC_U_ZIP" --dir current/mac-u || true
          test "$(sha256sum "current/win/$WIN_ZIP" | awk '{print $1}')" = "$WIN_INPUT_SHA256"
          test "$(sha256sum "current/mac/$MAC_ZIP" | awk '{print $1}')" = "$MAC_INPUT_SHA256"
          short_sha="$(printf '%s' "$GITHUB_SHA" | cut -c1-12)"
          win_backup="Win_Grok_Chameleon_a.previous-before-portable-sqlite-u-$short_sha.zip"
          mac_backup="Mac_Grok_Chameleon_a.previous-before-portable-sqlite-u-$short_sha.zip"
          cp "current/win/$WIN_ZIP" "backups/$win_backup"
          cp "current/mac/$MAC_ZIP" "backups/$mac_backup"
          gh release upload "$WIN_TAG" "backups/$win_backup" --repo "$GITHUB_REPOSITORY"
          gh release upload "$MAC_TAG" "backups/$mac_backup" --repo "$GITHUB_REPOSITORY"
          if test -f "current/win-u/$WIN_U_ZIP"; then
            cp "current/win-u/$WIN_U_ZIP" "backups/Win_Grok_Chameleon_u.previous-$short_sha.zip"
            gh release upload "$WIN_TAG" "backups/Win_Grok_Chameleon_u.previous-$short_sha.zip" --repo "$GITHUB_REPOSITORY"
          fi
          if test -f "current/mac-u/$MAC_U_ZIP"; then
            cp "current/mac-u/$MAC_U_ZIP" "backups/Mac_Grok_Chameleon_u.previous-$short_sha.zip"
            gh release upload "$MAC_TAG" "backups/Mac_Grok_Chameleon_u.previous-$short_sha.zip" --repo "$GITHUB_REPOSITORY"
          fi

          rollback() {
            echo 'Rolling back all production assets.' >&2
            gh release upload "$WIN_TAG" "current/win/$WIN_ZIP" --repo "$GITHUB_REPOSITORY" --clobber || true
            gh release upload "$MAC_TAG" "current/mac/$MAC_ZIP" --repo "$GITHUB_REPOSITORY" --clobber || true
            if test -f "current/win-u/$WIN_U_ZIP"; then
              gh release upload "$WIN_TAG" "current/win-u/$WIN_U_ZIP" --repo "$GITHUB_REPOSITORY" --clobber || true
            else
              gh release delete-asset "$WIN_TAG" "$WIN_U_ZIP" --repo "$GITHUB_REPOSITORY" --yes || true
            fi
            if test -f "current/mac-u/$MAC_U_ZIP"; then
              gh release upload "$MAC_TAG" "current/mac-u/$MAC_U_ZIP" --repo "$GITHUB_REPOSITORY" --clobber || true
            else
              gh release delete-asset "$MAC_TAG" "$MAC_U_ZIP" --repo "$GITHUB_REPOSITORY" --yes || true
            fi
          }
          trap rollback ERR
          gh release upload "$WIN_TAG" "release/windows/$WIN_ZIP" --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$WIN_TAG" "release/windows/$WIN_U_ZIP" --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$MAC_TAG" "release/macos/$MAC_ZIP" --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$MAC_TAG" "release/macos/$MAC_U_ZIP" --repo "$GITHUB_REPOSITORY" --clobber
          win_local="sha256:$(sha256sum "release/windows/$WIN_ZIP" | awk '{print $1}')"
          win_u_local="sha256:$(sha256sum "release/windows/$WIN_U_ZIP" | awk '{print $1}')"
          mac_local="sha256:$(sha256sum "release/macos/$MAC_ZIP" | awk '{print $1}')"
          mac_u_local="sha256:$(sha256sum "release/macos/$MAC_U_ZIP" | awk '{print $1}')"
          win_remote="$(gh release view "$WIN_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name == "'"$WIN_ZIP"'") | .digest')"
          win_u_remote="$(gh release view "$WIN_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name == "'"$WIN_U_ZIP"'") | .digest')"
          mac_remote="$(gh release view "$MAC_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name == "'"$MAC_ZIP"'") | .digest')"
          mac_u_remote="$(gh release view "$MAC_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name == "'"$MAC_U_ZIP"'") | .digest')"
          test "$win_local" = "$win_remote"
          test "$win_u_local" = "$win_u_remote"
          test "$mac_local" = "$mac_remote"
          test "$mac_u_local" = "$mac_u_remote"
          trap - ERR
          echo "windows-production-digest=$win_remote"
          echo "windows-u-production-digest=$win_u_remote"
          echo "mac-production-digest=$mac_remote"
          echo "mac-u-production-digest=$mac_u_remote"
